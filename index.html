<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#141213">
  <title>Inicio | Lion Gym Paraná</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ============================================================
       TOKENS DE DISEÑO — se van a mover a css/tokens.css cuando
       rediseñe el resto de las páginas.
       ============================================================ */
    :root {
      --fondo: #141213;
      --superficie: #1b1819;
      --elevada: #241f21;
      --linea: #2f292b;
      --linea-suave: #231e20;
      --texto: #f3f0ef;
      --texto-2: #a39a9c;
      --texto-3: #736b6d;
      --rojo: #cc0000;
      --rojo-hover: #e00b0b;
      --rojo-texto: #ff5a52;

      --f-titulo: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
      --f-texto: 'Barlow', 'Segoe UI', system-ui, sans-serif;

      --ancho-lateral: 248px;
      --radio: 6px;
      --transicion: 160ms ease;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: var(--f-texto);
      font-size: 16px;
      line-height: 1.5;
      background: var(--fondo);
      color: var(--texto);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
    svg { flex-shrink: 0; }

    :focus-visible {
      outline: 2px solid var(--rojo-texto);
      outline-offset: 2px;
      border-radius: 2px;
    }

    /* Mientras se verifica la sesión no mostramos nada */
    body.verificando .app { visibility: hidden; }

    .icono {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ============================================================
       ESTRUCTURA
       ============================================================ */
    .app {
      display: grid;
      grid-template-columns: var(--ancho-lateral) 1fr;
      min-height: 100vh;
    }

    /* ---------- Barra lateral ---------- */
    .lateral {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--superficie);
      border-right: 1px solid var(--linea);
      padding: 1.5rem 0 1.25rem;
      overflow-y: auto;
    }

    .marca {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0 1.25rem 1.5rem;
    }

    .marca img {
      width: 44px;
      height: 44px;
      object-fit: contain;
    }

    .marca-nombre {
      font-family: var(--f-titulo);
      font-weight: 700;
      font-size: 1.45rem;
      letter-spacing: 0.06em;
      line-height: 1;
      color: var(--rojo);
    }

    .marca-lugar {
      font-size: 0.8rem;
      color: var(--texto-2);
      margin-top: 0.2rem;
    }

    .nav { flex: 1; }

    .nav-grupo { padding: 0.9rem 0 0.4rem; }

    .nav-grupo-titulo {
      font-family: var(--f-titulo);
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
      color: var(--texto-3);
      padding: 0 1.25rem 0.35rem;
    }

    .nav-link {
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.55rem 1.25rem;
      font-size: 0.95rem;
      color: var(--texto-2);
      transition: color var(--transicion), background var(--transicion);
    }

    .nav-link:hover { color: var(--texto); background: var(--elevada); }

    .nav-link[aria-current="page"] {
      color: var(--texto);
      background: var(--elevada);
    }

    .nav-link[aria-current="page"]::before {
      content: '';
      position: absolute;
      left: 0;
      top: 6px;
      bottom: 6px;
      width: 3px;
      background: var(--rojo);
    }

    .lateral-pie {
      border-top: 1px solid var(--linea);
      padding: 1rem 1.25rem 0;
      margin-top: 1rem;
    }

    .admin-nombre {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .admin-rol {
      font-size: 0.8rem;
      color: var(--texto-3);
      margin-bottom: 0.75rem;
    }

    .btn-salir {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.9rem;
      color: var(--texto-2);
      padding: 0.35rem 0;
      transition: color var(--transicion);
    }

    .btn-salir:hover { color: var(--rojo-texto); }

    /* ---------- Área principal ---------- */
    .principal {
      min-width: 0;
      padding: 0 clamp(1.25rem, 4vw, 3.5rem) 4rem;
    }

    .contenido { max-width: 1080px; }

    /* ---------- Encabezado: el único gesto fuerte de la pantalla ---------- */
    .encabezado {
      position: relative;
      padding: clamp(2.5rem, 7vh, 4.5rem) 0 2.75rem;
      overflow: hidden;
    }

    .encabezado-leon {
      position: absolute;
      right: -40px;
      top: 50%;
      width: clamp(220px, 30vw, 380px);
      transform: translateY(-50%);
      opacity: 0.08;
      filter: grayscale(1) brightness(1.6);
      pointer-events: none;
      user-select: none;
    }

    .fecha {
      position: relative;
      font-size: 0.95rem;
      color: var(--texto-2);
      margin-bottom: 0.35rem;
    }

    .saludo {
      position: relative;
      font-family: var(--f-titulo);
      font-weight: 700;
      font-size: clamp(2.6rem, 6vw, 4.25rem);
      line-height: 0.95;
      letter-spacing: -0.005em;
      max-width: 14ch;
    }

    .trazo {
      position: relative;
      display: block;
      width: 84px;
      height: 7px;
      margin-top: 1.4rem;
      background: var(--rojo);
      transform: skewX(-24deg);
      transform-origin: left;
    }

    body.listo .trazo { animation: trazar 520ms cubic-bezier(.2,.8,.2,1) both; }

    @keyframes trazar {
      from { transform: skewX(-24deg) scaleX(0); }
      to   { transform: skewX(-24deg) scaleX(1); }
    }

    /* ---------- Acciones rápidas ---------- */
    .acciones {
      display: grid;
      grid-template-columns: 1.45fr 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 3.25rem;
    }

    .accion {
      display: flex;
      align-items: center;
      gap: 1rem;
      min-height: 84px;
      padding: 1rem 1.25rem;
      border-radius: var(--radio);
      border: 1px solid var(--linea);
      background: var(--superficie);
      transition: border-color var(--transicion), background var(--transicion);
    }

    .accion:hover { border-color: #4a3f42; background: var(--elevada); }

    .accion .icono { width: 26px; height: 26px; color: var(--texto-2); }

    .accion-titulo {
      font-family: var(--f-titulo);
      font-weight: 600;
      font-size: 1.35rem;
      line-height: 1.1;
    }

    .accion-desc {
      font-size: 0.85rem;
      color: var(--texto-2);
      margin-top: 0.15rem;
    }

    .accion.principal-accion {
      background: var(--rojo);
      border-color: var(--rojo);
    }

    .accion.principal-accion:hover { background: var(--rojo-hover); border-color: var(--rojo-hover); }
    .accion.principal-accion .icono { color: #fff; }
    .accion.principal-accion .accion-desc { color: rgba(255,255,255,0.82); }

    /* ---------- Módulos ---------- */
    .modulos-titulo {
      font-family: var(--f-titulo);
      font-weight: 600;
      font-size: 1.6rem;
      margin-bottom: 1rem;
    }

    .modulos {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--linea);
    }

    .grupo {
      padding: 1.25rem 1.5rem 0.5rem 0;
    }

    .grupo + .grupo {
      padding-left: 1.5rem;
      border-left: 1px solid var(--linea);
    }

    .grupo-titulo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-family: var(--f-titulo);
      font-weight: 600;
      font-size: 1.2rem;
      color: var(--texto);
      margin-bottom: 0.5rem;
    }

    .grupo-titulo .icono { color: var(--rojo-texto); width: 18px; height: 18px; }

    .fila {
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.8rem 0.25rem 0.8rem 0.9rem;
      border-bottom: 1px solid var(--linea-suave);
      transition: background var(--transicion);
    }

    .fila:last-child { border-bottom: none; }

    .fila::before {
      content: '';
      position: absolute;
      left: 0;
      top: 12px;
      bottom: 12px;
      width: 2px;
      background: var(--rojo);
      opacity: 0;
      transition: opacity var(--transicion);
    }

    .fila:hover { background: var(--superficie); }
    .fila:hover::before { opacity: 1; }

    .fila-texto { flex: 1; min-width: 0; }

    .fila-nombre { font-weight: 600; font-size: 0.98rem; }

    .fila-desc {
      font-size: 0.85rem;
      color: var(--texto-2);
      margin-top: 0.1rem;
    }

    .fila .chevron { width: 16px; height: 16px; color: var(--texto-3); transition: color var(--transicion); }
    .fila:hover .chevron { color: var(--texto); }

    /* ---------- Barra superior e inferior (solo celular) ---------- */
    .barra-movil,
    .nav-inferior,
    .velo { display: none; }

    /* ============================================================
       TABLET
       ============================================================ */
    @media (max-width: 1080px) {
      .modulos { grid-template-columns: 1fr 1fr; }
      .grupo:nth-child(3) {
        grid-column: 1 / -1;
        padding-left: 0;
        border-left: none;
        border-top: 1px solid var(--linea);
      }
    }

    /* ============================================================
       CELULAR
       ============================================================ */
    @media (max-width: 820px) {
      .app { grid-template-columns: 1fr; }

      .lateral {
        position: fixed;
        z-index: 40;
        left: 0;
        top: 0;
        width: min(84vw, 300px);
        transform: translateX(-100%);
        transition: transform 220ms ease;
        padding-top: calc(1.5rem + env(safe-area-inset-top));
      }

      body.menu-abierto .lateral { transform: translateX(0); }

      .velo {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 30;
        background: rgba(0,0,0,0.6);
        opacity: 0;
        pointer-events: none;
        transition: opacity 220ms ease;
      }

      body.menu-abierto .velo { opacity: 1; pointer-events: auto; }

      .barra-movil {
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 20;
        padding: calc(0.75rem + env(safe-area-inset-top)) 1.25rem 0.75rem;
        background: rgba(20,18,19,0.94);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--linea);
      }

      .barra-movil .marca { padding: 0; gap: 0.6rem; }
      .barra-movil .marca img { width: 34px; height: 34px; }
      .barra-movil .marca-nombre { font-size: 1.25rem; }

      .principal { padding-bottom: calc(6rem + env(safe-area-inset-bottom)); }

      .encabezado { padding: 2rem 0 2rem; }
      .encabezado-leon { width: 220px; right: -70px; }

      .acciones { grid-template-columns: 1fr; margin-bottom: 2.5rem; }
      .accion { min-height: 72px; }

      .modulos { grid-template-columns: 1fr; border-top: none; }
      .grupo,
      .grupo + .grupo,
      .grupo:nth-child(3) {
        padding: 1.25rem 0 0.5rem;
        border-left: none;
        border-top: 1px solid var(--linea);
      }

      .fila { min-height: 56px; }

      .nav-inferior {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        position: fixed;
        z-index: 20;
        left: 0;
        right: 0;
        bottom: 0;
        padding-bottom: env(safe-area-inset-bottom);
        background: rgba(27,24,25,0.97);
        backdrop-filter: blur(8px);
        border-top: 1px solid var(--linea);
      }

      .nav-inferior a,
      .nav-inferior button {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.2rem;
        min-height: 60px;
        font-size: 0.72rem;
        color: var(--texto-2);
      }

      .nav-inferior [aria-current="page"] { color: var(--texto); }
      .nav-inferior [aria-current="page"] .icono { color: var(--rojo-texto); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

    const icono = (id, clase = 'icono') =>
      `<svg class="${clase}" viewBox="0 0 24 24"><use href="#${id}"/></svg>`

    function renderizarNavegacion() {
      const inicio = `
        <div class="nav-grupo">
          <a class="nav-link" href="index.html" aria-current="page">${icono('i-inicio')}Inicio</a>
          <a class="nav-link" href="recepcion.html">${icono('i-recepcion')}Recepción</a>
        </div>`

      const grupos = MODULOS.map(g => `
        <div class="nav-grupo">
          <div class="nav-grupo-titulo">${g.titulo}</div>
          ${g.items.map(i => `<a class="nav-link" href="${i.href}">${icono(i.icono)}${i.nombre}</a>`).join('')}
        </div>`).join('')

      document.getElementById('navLateral').innerHTML = inicio + grupos
    }

    function renderizarModulos() {
      document.getElementById('modulos').innerHTML = MODULOS.map(g => `
        <div class="grupo">
          <h3 class="grupo-titulo">${icono(g.icono)}${g.titulo}</h3>
          ${g.items.map(i => `
            <a class="fila" href="${i.href}">
              <div class="fila-texto">
                <div class="fila-nombre">${i.nombre}</div>
                <div class="fila-desc">${i.desc}</div>
              </div>
              ${icono('i-chevron', 'icono chevron')}
            </a>`).join('')}
        </div>`).join('')
    }

    /* ============================================================
       ENCABEZADO
       ============================================================ */
    function renderizarEncabezado(nombreAdmin) {
      const ahora = new Date()
      const fecha = ahora.toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' })
      document.getElementById('fecha').textContent = fecha.charAt(0).toUpperCase() + fecha.slice(1)

      const hora = ahora.getHours()
      const saludo = hora < 12 ? 'Buen día' : hora < 20 ? 'Buenas tardes' : 'Buenas noches'
      const primerNombre = (nombreAdmin || '').trim().split(/\s+/)[0]

      document.getElementById('saludo').textContent = primerNombre ? `${saludo}, ${primerNombre}` : saludo
      document.getElementById('adminNombre').textContent = nombreAdmin || 'Administrador'
    }

    /* ============================================================
       MENÚ EN CELULAR
       ============================================================ */
    const btnMenu = document.getElementById('btnMenu')

    function alternarMenu(abrir) {
      document.body.classList.toggle('menu-abierto', abrir)
      btnMenu.setAttribute('aria-expanded', String(abrir))
    }

    btnMenu.addEventListener('click', () => alternarMenu(!document.body.classList.contains('menu-abierto')))
    document.getElementById('velo').addEventListener('click', () => alternarMenu(false))
    document.addEventListener('keydown', e => { if (e.key === 'Escape') alternarMenu(false) })

    /* ============================================================
       ACCESO (misma verificación que el resto de las páginas admin)
       ============================================================ */
    async function verificarAcceso() {
      const { data } = await db.auth.getSession()
      if (!data.session) {
        window.location.href = 'login.html'
        return
      }

      const { data: admin } = await db
        .from('administradores')
        .select('nombre')
        .eq('id', data.session.user.id)
        .eq('activo', true)
        .limit(1)

      if (!admin || admin.length === 0) {
        await db.auth.signOut()
        window.location.href = 'login.html'
        return
      }

      renderizarEncabezado(admin[0].nombre)
      document.body.classList.remove('verificando')
      document.body.classList.add('listo')
    }

    document.getElementById('btnSalir').addEventListener('click', async () => {
      await db.auth.signOut()
      window.location.href = 'login.html'
    })

    // Si el logo no carga, lo ocultamos para no mostrar un ícono roto
    document.querySelectorAll('img[src="leon.webp"]').forEach(img => {
      img.addEventListener('error', () => { img.style.display = 'none' })
    })

    renderizarNavegacion()
    renderizarModulos()
    verificarAcceso()
  </script>
</body>
</html>
