<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#141213">
  <title>Inicio | Lion Gym Paraná</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ============================================================
       TOKENS DE DISEÑO — se van a mover a css/tokens.css cuando
       rediseñemos el resto de las páginas.
       ============================================================ */
    :root {
      --fondo: #141213;
      --superficie: #1b1819;
      --elevada: #241f21;
      --linea: #2f292b;
      --linea-suave: #231e20;
      --texto: #f3f0ef;
      --texto-2: #a39a9c;
      --texto-3: #736b6d;
      --rojo: #cc0000;
      --rojo-hover: #e00b0b;
      --rojo-texto: #ff5a52;

      --f-titulo: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
      --f-texto: 'Barlow', 'Segoe UI', system-ui, sans-serif;

      --ancho-lateral: 248px;
      --radio: 6px;
      --transicion: 160ms ease;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: var(--f-texto);
      font-size: 16px;
      line-height: 1.5;
      background: var(--fondo);
      color: var(--texto);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
    svg { flex-shrink: 0; }

    :focus-visible {
      outline: 2px solid var(--rojo-texto);
      outline-offset: 2px;
      border-radius: 2px;
    }

    /* Mientras se verifica la sesión no mostramos nada */
    body.verificando .app { visibility: hidden; }

    .icono {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ============================================================
       ESTRUCTURA
       ============================================================ */
    .app {
      display: grid;
      grid-template-columns: var(--ancho-lateral) 1fr;
      min-height: 100vh;
    }

    /* ---------- Barra lateral ---------- */
    .lateral {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--superficie);
      border-right: 1px solid var(--linea);
      padding: 1.5rem 0 1.25rem;
      overflow-y: auto;
    }

    .marca {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0 1.25rem 1.5rem;
    }

    .marca img {
      width: 44px;
      height: 44px;
      object-fit: contain;
    }

    .marca-nombre {
      font-family: var(--f-titulo);
      font-weight: 700;
      font-size: 1.45rem;
      letter-spacing: 0.06em;
      line-height: 1;
      color: var(--rojo);
    }

    .marca-lugar {
      font-size: 0.8rem;
      color: var(--texto-2);
      margin-top: 0.2rem;
    }

    .nav { flex: 1; }

    .nav-grupo { padding: 0.9rem 0 0.4rem; }

    .nav-grupo-titulo {
      font-family: var(--f-titulo);
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
      color: var(--texto-3);
      padding: 0 1.25rem 0.35rem;
    }

    .nav-link {
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.55rem 1.25rem;
      font-size: 0.95rem;
      color: var(--texto-2);
      transition: color var(--transicion), background var(--transicion);
    }

    .nav-link:hover { color: var(--texto); background: var(--elevada); }

    .nav-link[aria-current="page"] {
      color: var(--texto);
      background: var(--elevada);
    }

    .nav-link[aria-current="page"]::before {
      content: '';
      position: absolute;
      left: 0;
      top: 6px;
      bottom: 6px;
      width: 3px;
      background: var(--rojo);
    }

    .lateral-pie {
      border-top: 1px solid var(--linea);
      padding: 1rem 1.25rem 0;
      margin-top: 1rem;
    }

    .admin-nombre {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .admin-rol {
      font-size: 0.8rem;
      color: var(--texto-3);
      margin-bottom: 0.75rem;
    }

    .btn-salir {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.9rem;
      color: var(--texto-2);
      padding: 0.35rem 0;
      transition: color var(--transicion);
    }

    .btn-salir:hover { color: var(--rojo-texto); }

    /* ---------- Área principal ---------- */
    .principal {
      min-width: 0;
      padding: 0 clamp(1.25rem, 4vw, 3.5rem) 4rem;
    }

    .contenido { max-width: 1080px; }

    /* ---------- Encabezado: el único gesto fuerte de la pantalla ---------- */
    .encabezado {
      position: relative;
      padding: clamp(2.5rem, 7vh, 4.5rem) 0 2.75rem;
      overflow: hidden;
    }

    .encabezado-leon {
      position: absolute;
      right: -40px;
      top: 50%;
      width: clamp(220px, 30vw, 380px);
      transform: translateY(-50%);
      opacity: 0.08;
      filter: grayscale(1) brightness(1.6);
      clip-path: inset(0 0 7% 0); /* recorta el texto que trae el logo abajo */
      pointer-events: none;
      user-select: none;
    }

    .fecha {
      position: relative;
      font-size: 0.95rem;
      color: var(--texto-2);
      margin-bottom: 0.35rem;
    }

    .saludo {
      position: relative;
      font-family: var(--f-titulo);
      font-weight: 700;
      font-size: clamp(2.6rem, 6vw, 4.25rem);
      line-height: 0.95;
      letter-spacing: -0.005em;
      max-width: 14ch;
    }

    .trazo {
      position: relative;
      display: block;
      width: 84px;
      height: 7px;
      margin-top: 1.4rem;
      background: var(--rojo);
      transform: skewX(-24deg);
      transform-origin: left;
    }

    body.listo .trazo { animation: trazar 520ms cubic-bezier(.2,.8,.2,1) both; }

    @keyframes trazar {
      from { transform: skewX(-24deg) scaleX(0); }
      to   { transform: skewX(-24deg) scaleX(1); }
    }

    /* ---------- Acciones rápidas ---------- */
    .acciones {
      display: grid;
      grid-template-columns: 1.45fr 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 3.25rem;
    }

    .accion {
      display: flex;
      align-items: center;
      gap: 1rem;
      min-height: 84px;
      padding: 1rem 1.25rem;
      border-radius: var(--radio);
      border: 1px solid var(--linea);
      background: var(--superficie);
      transition: border-color var(--transicion), background var(--transicion);
    }

    .accion:hover { border-color: #4a3f42; background: var(--elevada); }

    .accion .icono { width: 26px; height: 26px; color: var(--texto-2); }

    .accion-titulo {
      font-family: var(--f-titulo);
      font-weight: 600;
      font-size: 1.35rem;
      line-height: 1.1;
    }

    .accion-desc {
      font-size: 0.85rem;
      color: var(--texto-2);
      margin-top: 0.15rem;
    }

    .accion.principal-accion {
      background: var(--rojo);
      border-color: var(--rojo);
    }

    .accion.principal-accion:hover { background: var(--rojo-hover); border-color: var(--rojo-hover); }
    .accion.principal-accion .icono { color: #fff; }
    .accion.principal-accion .accion-desc { color: rgba(255,255,255,0.82); }

    /* ---------- Módulos ---------- */
    .modulos-titulo {
      font-family: var(--f-titulo);
      font-weight: 600;
      font-size: 1.6rem;
      margin-bottom: 1rem;
    }

    .modulos {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--linea);
    }

    .grupo {
      padding: 1.25rem 1.5rem 0.5rem 0;
    }

    .grupo + .grupo {
      padding-left: 1.5rem;
      border-left: 1px solid var(--linea);
    }

    .grupo-titulo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-family: var(--f-titulo);
      font-weight: 600;
      font-size: 1.2rem;
      color: var(--texto);
      margin-bottom: 0.5rem;
    }

    .grupo-titulo .icono { color: var(--rojo-texto); width: 18px; height: 18px; }

    .fila {
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.8rem 0.25rem 0.8rem 0.9rem;
      border-bottom: 1px solid var(--linea-suave);
      transition: background var(--transicion);
    }

    .fila:last-child { border-bottom: none; }

    .fila::before {
      content: '';
      position: absolute;
      left: 0;
      top: 12px;
      bottom: 12px;
      width: 2px;
      background: var(--rojo);
      opacity: 0;
      transition: opacity var(--transicion);
    }

    .fila:hover { background: var(--superficie); }
    .fila:hover::before { opacity: 1; }

    .fila-texto { flex: 1; min-width: 0; }

    .fila-nombre { font-weight: 600; font-size: 0.98rem; }

    .fila-desc {
      font-size: 0.85rem;
      color: var(--texto-2);
      margin-top: 0.1rem;
    }

    .fila .chevron { width: 16px; height: 16px; color: var(--texto-3); transition: color var(--transicion); }
    .fila:hover .chevron { color: var(--texto); }

    /* ---------- Gym Levels en el inicio ---------- */
    .nivel-bronce   { --n-claro: #e7ab74; --n-medio: #b8733a; --n-oscuro: #6e3c18; }
    .nivel-plata    { --n-claro: #f4f6f9; --n-medio: #b9bfc7; --n-oscuro: #69707a; }
    .nivel-oro      { --n-claro: #ffe594; --n-medio: #e0b043; --n-oscuro: #8c6417; }
    .nivel-diamante { --n-claro: #d2f5ff; --n-medio: #63c3ef; --n-oscuro: #1f5f9e; }
    .escudo { display: block; flex: none; }

    .gl-inicio {
      margin-bottom: 3.25rem;
      border-radius: 12px;
      border: 1px solid var(--linea);
      background:
        radial-gradient(ellipse 45% 120% at 100% 0%, rgba(224, 176, 67, 0.08), transparent 70%),
        var(--superficie);
      overflow: hidden;
    }

    .gl-inicio-cab {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.1rem 1.4rem;
      border-bottom: 1px solid var(--linea);
    }

    .gl-inicio-titulo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-family: var(--f-titulo);
      font-weight: 600;
      font-size: 1.45rem;
      line-height: 1.1;
    }

    .gl-inicio-titulo .icono { color: #f0c75e; width: 22px; height: 22px; }
    .gl-inicio-titulo span { color: var(--texto-3); font-weight: 500; }

    .gl-ver {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--rojo-texto);
      white-space: nowrap;
    }

    .gl-ver .icono { width: 16px; height: 16px; }
    .gl-ver:hover { color: #ff8078; }

    .gl-inicio-cuerpo {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
    }

    .gl-top { list-style: none; padding: 0.5rem 1.4rem 0.8rem; }

    .gl-fila {
      display: grid;
      grid-template-columns: 2.1rem minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 0.75rem;
      padding: 0.55rem 0;
      border-bottom: 1px solid var(--linea-suave);
    }

    .gl-fila:last-child { border-bottom: none; }

    .gl-puesto {
      display: grid;
      place-items: center;
      width: 1.9rem;
      height: 1.9rem;
      border-radius: 50%;
      font-family: var(--f-titulo);
      font-weight: 700;
      color: var(--texto-2);
    }

    .gl-puesto.medalla {
      color: #1b1819;
      background: radial-gradient(circle at 35% 30%, var(--n-claro), var(--n-medio) 55%, var(--n-oscuro));
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
    }

    .gl-nombre { min-width: 0; }
    .gl-nombre strong { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .gl-nombre span { display: block; font-size: 0.8rem; color: var(--texto-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .gl-dias {
      min-width: 3.5rem;
      text-align: right;
      font-family: var(--f-titulo);
      font-weight: 700;
      font-size: 1.35rem;
    }

    .gl-dias small { font-family: var(--f-texto); font-size: 0.75rem; font-weight: 500; color: var(--texto-3); margin-left: 0.15rem; }

    .gl-lado {
      padding: 1.1rem 1.4rem 1.2rem;
      border-left: 1px solid var(--linea);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .gl-numeros { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .gl-numero span { display: block; font-size: 0.8rem; color: var(--texto-3); }

    .gl-numero strong {
      font-family: var(--f-titulo);
      font-weight: 700;
      font-size: 2.2rem;
      line-height: 1;
    }

    .gl-niveles { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }

    .gl-nivel {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.55rem 0.7rem;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--linea-suave);
    }

    .gl-nivel div { font-size: 0.8rem; color: var(--texto-2); line-height: 1.2; }
    .gl-nivel strong { display: block; font-family: var(--f-titulo); font-size: 1.45rem; color: var(--n-claro); }

    .gl-vacio { padding: 1.5rem 1.4rem; color: var(--texto-3); }
    .gl-vacio strong { display: block; color: var(--texto); margin-bottom: 0.2rem; }

    /* ---------- Barra superior e inferior (solo celular) ---------- */
    .barra-movil,
    .nav-inferior,
    .velo { display: none; }

    /* ============================================================
       TABLET
       ============================================================ */
    @media (max-width: 1080px) {
      .modulos { grid-template-columns: 1fr 1fr; }
      .grupo:nth-child(3) {
        grid-column: 1 / -1;
        padding-left: 0;
        border-left: none;
        border-top: 1px solid var(--linea);
      }
    }

    /* ============================================================
       CELULAR
       ============================================================ */
    @media (max-width: 820px) {
      .app { grid-template-columns: 1fr; }

      .lateral {
        position: fixed;
        z-index: 40;
        left: 0;
        top: 0;
        width: min(84vw, 300px);
        transform: translateX(-100%);
        transition: transform 220ms ease;
        padding-top: calc(1.5rem + env(safe-area-inset-top));
      }

      body.menu-abierto .lateral { transform: translateX(0); }

      .velo {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 30;
        background: rgba(0,0,0,0.6);
        opacity: 0;
        pointer-events: none;
        transition: opacity 220ms ease;
      }

      body.menu-abierto .velo { opacity: 1; pointer-events: auto; }

      .barra-movil {
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 20;
        padding: calc(0.75rem + env(safe-area-inset-top)) 1.25rem 0.75rem;
        background: rgba(20,18,19,0.94);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--linea);
      }

      .barra-movil .marca { padding: 0; gap: 0.6rem; }
      .barra-movil .marca img { width: 34px; height: 34px; }
      .barra-movil .marca-nombre { font-size: 1.25rem; }

      .principal { padding-bottom: calc(6rem + env(safe-area-inset-bottom)); }

      .encabezado { padding: 2rem 0 2rem; }
      .encabezado-leon { width: 220px; right: -70px; }

      .acciones { grid-template-columns: 1fr; margin-bottom: 2.5rem; }
      .gl-inicio { margin-bottom: 2.5rem; }
      .gl-inicio-cab { padding: 1rem; }
      .gl-inicio-titulo { font-size: 1.3rem; white-space: nowrap; }
      .gl-inicio-titulo span { display: none; }
      .gl-inicio-cuerpo { grid-template-columns: 1fr; }
      .gl-top { padding: 0.25rem 1rem 0.5rem; }
      .gl-lado { border-left: none; border-top: 1px solid var(--linea); padding: 1rem; }
      .accion { min-height: 72px; }

      .modulos { grid-template-columns: 1fr; border-top: none; }
      .grupo,
      .grupo + .grupo,
      .grupo:nth-child(3) {
        padding: 1.25rem 0 0.5rem;
        border-left: none;
        border-top: 1px solid var(--linea);
      }

      .fila { min-height: 56px; }

      .nav-inferior {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        position: fixed;
        z-index: 20;
        left: 0;
        right: 0;
        bottom: 0;
        padding-bottom: env(safe-area-inset-bottom);
        background: rgba(27,24,25,0.97);
        backdrop-filter: blur(8px);
        border-top: 1px solid var(--linea);
      }

      .nav-inferior a,
      .nav-inferior button {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.2rem;
        min-height: 60px;
        font-size: 0.72rem;
        color: var(--texto-2);
      }

      .nav-inferior [aria-current="page"] { color: var(--texto); }
      .nav-inferior [aria-current="page"] .icono { color: var(--rojo-texto); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body class="verificando">

  <div class="app">

    <!-- ============ BARRA LATERAL (en celular: menú desplegable) ============ -->
    <aside class="lateral" id="lateral" aria-label="Navegación principal">
      <a class="marca" href="index.html">
        <img src="leon.webp" alt="">
        <div>
          <div class="marca-nombre">LION GYM</div>
          <div class="marca-lugar">Paraná</div>
        </div>
      </a>

      <nav class="nav" id="navLateral"></nav>

      <div class="lateral-pie">
        <div class="admin-nombre" id="adminNombre"></div>
        <div class="admin-rol">Administrador</div>
        <button class="btn-salir" id="btnSalir" type="button">
          <svg class="icono" viewBox="0 0 24 24"><use href="#i-salir"/></svg>
          Cerrar sesión
        </button>
      </div>
    </aside>

    <div class="velo" id="velo"></div>

    <!-- ============ CONTENIDO ============ -->
    <div class="principal-wrap">

      <header class="barra-movil">
        <a class="marca" href="index.html">
          <img src="leon.webp" alt="">
          <div class="marca-nombre">LION GYM</div>
        </a>
      </header>

      <main class="principal">
        <div class="contenido">

          <section class="encabezado">
            <img class="encabezado-leon" src="leon.webp" alt="" aria-hidden="true">
            <p class="fecha" id="fecha"></p>
            <h1 class="saludo" id="saludo">Hola</h1>
            <span class="trazo" aria-hidden="true"></span>
          </section>

          <section class="acciones" aria-label="Acciones rápidas">
            <a class="accion principal-accion" href="registro-pagos.html">
              <svg class="icono" viewBox="0 0 24 24"><use href="#i-pago"/></svg>
              <div>
                <div class="accion-titulo">Registrar pago</div>
                <div class="accion-desc">Buscar un socio por DNI y cobrar su cuota</div>
              </div>
            </a>
            <a class="accion" href="alta-socio.html">
              <svg class="icono" viewBox="0 0 24 24"><use href="#i-usuario-mas"/></svg>
              <div>
                <div class="accion-titulo">Alta de socio</div>
                <div class="accion-desc">Cargar un socio nuevo</div>
              </div>
            </a>
            <a class="accion" href="recepcion.html">
              <svg class="icono" viewBox="0 0 24 24"><use href="#i-recepcion"/></svg>
              <div>
                <div class="accion-titulo">Abrir recepción</div>
                <div class="accion-desc">Pantalla de ingreso por DNI</div>
              </div>
            </a>
          </section>

          <!--
            Reservado para estadísticas reales (socios activos, cuotas
            vencidas, ingresos de hoy, etc.). Queda oculto hasta conectar datos.
          -->
          <section id="resumen" hidden></section>

          <!-- Gym Levels: ranking del mes (migraciones 006 y 009). Sin ellas queda oculto. -->
          <section class="gl-inicio" id="glInicio" aria-labelledby="tituloGl" hidden></section>

          <section aria-labelledby="tituloModulos">
            <h2 class="modulos-titulo" id="tituloModulos">Gestión</h2>
            <div class="modulos" id="modulos"></div>
          </section>

        </div>
      </main>
    </div>
  </div>

  <!-- ============ NAVEGACIÓN INFERIOR (solo celular) ============ -->
  <nav class="nav-inferior" aria-label="Accesos rápidos">
    <a href="index.html" aria-current="page">

  <!-- ============ ICONOS ============ -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">

      <g id="i-usuarios"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.7-3.5 3.3-5.5 6.5-5.5s5.8 2 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17.5 14.6c2.1.4 3.5 2 4 4.4"/></g>
      <g id="i-usuario-mas"><circle cx="10" cy="8" r="3.5"/><path d="M3.5 20c.7-3.5 3.3-5.5 6.5-5.5 1.4 0 2.7.4 3.8 1.1"/><path d="M19 13.5v6M16 16.5h6"/></g>
      <g id="i-usuario-editar"><circle cx="10" cy="8" r="3.5"/><path d="M3.5 20c.7-3.5 3.3-5.5 6.5-5.5 1 0 1.9.2 2.7.5"/><path d="m15 20.5.6-2.6 4.6-4.6 2 2-4.6 4.6z"/></g>

      <g id="i-planes"><path d="M3.5 12.5V4.5a1 1 0 0 1 1-1h8l8 8a1 1 0 0 1 0 1.4l-7.6 7.6a1 1 0 0 1-1.4 0z"/><circle cx="8" cy="8" r="1.3"/></g>
      <g id="i-rutinas"><path d="M6.5 6v12M17.5 6v12M3.5 9v6M20.5 9v6M6.5 12h11"/></g>
      <g id="i-plantillas"><path d="m12 3.5-9 4.5 9 4.5 9-4.5z"/><path d="m3 12 9 4.5 9-4.5"/><path d="m3 16 9 4.5 9-4.5"/></g>
      <g id="i-recepcion"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8.5 20h7M12 16v4"/></g>
      <g id="i-salir"><path d="M14.5 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4"/><path d="m10 8-4 4 4 4M6 12h10"/></g>
      <g id="i-menu"><path d="M4 7h16M4 12h16M4 17h16"/></g>
      <g id="i-chevron"><path d="m9.5 6 6 6-6 6"/></g>
      <g id="i-trofeo"><path d="M8 4h8v6a4 4 0 0 1-8 0zM8 6H4.5a3.5 3.5 0 0 0 3.8 4.2M16 6h3.5a3.5 3.5 0 0 1-3.8 4.2M12 14v3.5M8.5 20.5h7M10 17.5h4"/></g>
    </defs>
  </svg>

  <script>
    const SUPABASE_URL = 'https://hlhsrbstxxdanyckujem.supabase.co'
    const SUPABASE_KEY = 'sb_publishable_NOA6FfVrGTtkX0eu_rvyZA_Uyye2XRl'
    const { createClient } = supabase
    const db = createClient(SUPABASE_URL, SUPABASE_KEY)

    /* ============================================================
       MÓDULOS DEL SISTEMA
       Única fuente de la navegación: la barra lateral y las
       columnas de "Gestión" se arman desde acá. Para sumar un
       módulo nuevo (asistencia, Mercado Pago, etc.) alcanza con
       agregar una entrada.
       ============================================================ */
    const MODULOS = [
      {
        id: 'socios',
        titulo: 'Socios',
        icono: 'i-usuarios',
        items: [
          { nombre: 'Listado de socios', desc: 'Todos los socios y el estado de su cuota', href: 'panel-general.html', icono: 'i-usuarios' },
          { nombre: 'Alta de socio', desc: 'Cargar un socio nuevo y asignarle un plan', href: 'alta-socio.html', icono: 'i-usuario-mas' },
          { nombre: 'Editar socio', desc: 'Cambiar datos, plan o dar de baja', href: 'editar-socio.html', icono: 'i-usuario-editar' }
        ]
      },
      {
        id: 'finanzas',
        titulo: 'Pagos y caja',
        icono: 'i-caja',
        items: [
          { nombre: 'Registrar pago', desc: 'Cobrar la cuota de un socio', href: 'registro-pagos.html', icono: 'i-pago' },
          { nombre: 'Caja', desc: 'Ingresos, gastos y resultado del mes', href: 'caja.html', icono: 'i-caja' },
          { nombre: 'Planes y precios', desc: 'Precios, día de corte y recargo', href: 'planes.html', icono: 'i-planes' }
        ]
      },
      {
        id: 'entrenamiento',
        titulo: 'Entrenamiento',
        icono: 'i-rutinas',
        items: [
          { nombre: 'Rutinas', desc: 'Armar la rutina de un socio y enviarle el link', href: 'rutinas.html', icono: 'i-rutinas' },
          { nombre: 'Plantillas de rutina', desc: 'Rutinas base por nivel', href: 'plantillas.html', icono: 'i-plantillas' },
          { nombre: 'Gym Levels', desc: 'Ranking del mes, niveles e insignias', href: 'gym-levels.html', icono: 'i-trofeo' }
        ]
      }
    ]

    const icono = (id, clase = 'icono') =>
      `<svg class="${clase}" viewBox="0 0 24 24"><use href="#${id}"/></svg>`

    function renderizarNavegacion() {
      const inicio = `
        <div class="nav-grupo">
          <a class="nav-link" href="index.html" aria-current="page">${icono('i-inicio')}Inicio</a>
          <a class="nav-link" href="recepcion.html">${icono('i-recepcion')}Recepción</a>
        </div>`

      const grupos = MODULOS.map(g => `
        <div class="nav-grupo">
          <div class="nav-grupo-titulo">${g.titulo}</div>
          ${g.items.map(i => `<a class="nav-link" href="${i.href}">${icono(i.icono)}${i.nombre}</a>`).join('')}
        </div>`).join('')

      document.getElementById('navLateral').innerHTML = inicio + grupos
    }

    function renderizarModulos() {
      document.getElementById('modulos').innerHTML = MODULOS.map(g => `
        <div class="grupo">
          <h3 class="grupo-titulo">${icono(g.icono)}${g.titulo}</h3>
          ${g.items.map(i => `
            <a class="fila" href="${i.href}">
              <div class="fila-texto">
                <div class="fila-nombre">${i.nombre}</div>
                <div class="fila-desc">${i.desc}</div>
              </div>
              ${icono('i-chevron', 'icono chevron')}
            </a>`).join('')}
        </div>`).join('')
    }

    /* ============================================================
       ENCABEZADO
       ============================================================ */
    function renderizarEncabezado(nombreAdmin) {
      const ahora = new Date()
      const fecha = ahora.toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' })
      document.getElementById('fecha').textContent = fecha.charAt(0).toUpperCase() + fecha.slice(1)

      const hora = ahora.getHours()
      const saludo = hora < 12 ? 'Buen día' : hora < 20 ? 'Buenas tardes' : 'Buenas noches'
      const primerNombre = (nombreAdmin || '').trim().split(/\s+/)[0]

      document.getElementById('saludo').textContent = primerNombre ? `${saludo}, ${primerNombre}` : saludo
      document.getElementById('adminNombre').textContent = nombreAdmin || 'Administrador'
    }

    /* ============================================================
       MENÚ EN CELULAR
       ============================================================ */
    const btnMenu = document.getElementById('btnMenu')

    function alternarMenu(abrir) {
      document.body.classList.toggle('menu-abierto', abrir)
      btnMenu.setAttribute('aria-expanded', String(abrir))
    }

    btnMenu.addEventListener('click', () => alternarMenu(!document.body.classList.contains('menu-abierto')))
    document.getElementById('velo').addEventListener('click', () => alternarMenu(false))
    document.addEventListener('keydown', e => { if (e.key === 'Escape') alternarMenu(false) })

    /* ============================================================
       ACCESO (misma verificación que el resto de las páginas admin)
       ============================================================ */
    async function verificarAcceso() {
      const { data } = await db.auth.getSession()
      if (!data.session) {
        window.location.href = 'login.html'
        return
      }

      const { data: admin } = await db
        .from('administradores')
        .select('nombre')
        .eq('id', data.session.user.id)
        .eq('activo', true)
        .limit(1)

      if (!admin || admin.length === 0) {
        await db.auth.signOut()
        window.location.href = 'login.html'
        return
      }

      renderizarEncabezado(admin[0].nombre)
      document.body.classList.remove('verificando')
      document.body.classList.add('listo')
      cargarGymLevels()
    }


    /* ============================================================
       GYM LEVELS EN EL INICIO
       Datos reales de gym_levels_admin (migración 009). Si todavía no
       está aplicada, el bloque no aparece.
       ============================================================ */
    const NIVELES = {
      bronce:   { nombre: 'Bronce',   claro: '#e7ab74', medio: '#b8733a', oscuro: '#6e3c18' },
      plata:    { nombre: 'Plata',    claro: '#f4f6f9', medio: '#b9bfc7', oscuro: '#69707a' },
      oro:      { nombre: 'Oro',      claro: '#ffe594', medio: '#e0b043', oscuro: '#8c6417' },
      diamante: { nombre: 'Diamante', claro: '#d2f5ff', medio: '#63c3ef', oscuro: '#1f5f9e' }
    }
    let idSvg = 0

    function escudoNivel(nivel, tam = 64) {
      const n = NIVELES[nivel] || NIVELES.bronce
      const id = 'esc-' + (++idSvg)
      const galon = y => `<path d="M20 ${y} 32 ${y + 7} 44 ${y}" fill="none" stroke="${n.oscuro}" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>`
      const marcas = {
        bronce: galon(33), plata: galon(28) + galon(38), oro: galon(23) + galon(33) + galon(43),
        diamante: `<path d="M23 27h18l5 7-14 16-14-16z" fill="${n.claro}" stroke="${n.oscuro}" stroke-width="2.2" stroke-linejoin="round"/><path d="M18 34h28M27 27l-2 7 7 16 7-16-2-7" fill="none" stroke="${n.oscuro}" stroke-width="1.6" stroke-linejoin="round"/>`
      }
      return `<svg class="escudo" width="${tam}" height="${Math.round(tam * 1.125)}" viewBox="0 0 64 72" aria-hidden="true">
        <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${n.claro}"/><stop offset=".55" stop-color="${n.medio}"/><stop offset="1" stop-color="${n.oscuro}"/></linearGradient></defs>
        <path d="M32 3 58 12v24c0 16-12 27-26 33C18 63 6 52 6 36V12z" fill="url(#${id})" stroke="${n.oscuro}" stroke-width="1.5"/>
        <path d="M32 9.5 52.5 16.5v19.5c0 12.5-9 21.5-20.5 26.5-11.5-5-20.5-14-20.5-26.5V16.5z" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1.2"/>
        <path d="M32 3 58 12v8L6 44V12z" fill="rgba(255,255,255,.14)"/>${marcas[nivel] || marcas.bronce}</svg>`
    }

    const escaparTexto = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
    const nombreBonito = t => String(t || '').toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase())

    async function cargarGymLevels() {
      const caja = document.getElementById('glInicio')
      let d
      try {
        const { data, error } = await db.rpc('gym_levels_admin', { p_mes: null })
        if (error || !data) return
        d = data
      } catch { return }

      const mes = new Date(d.mes + 'T00:00:00').toLocaleDateString('es-AR', { month: 'long' })
      const medallas = { 1: 'oro', 2: 'plata', 3: 'bronce' }

      const top = d.filas.slice(0, 5).map(f => `
        <li class="gl-fila">
          <span class="gl-puesto${medallas[f.puesto] ? ` medalla nivel-${medallas[f.puesto]}` : ''}">${f.puesto}</span>
          <span class="gl-nombre">
            <strong>${escaparTexto(nombreBonito(f.nombre))}</strong>
            <span>${f.alias ? escaparTexto(f.alias) : NIVELES[f.nivel].nombre}${f.oculto ? ' · oculto en el ranking' : ''}</span>
          </span>
          ${escudoNivel(f.nivel, 22)}
          <span class="gl-dias">${f.dias}<small>${f.dias === 1 ? 'día' : 'días'}</small></span>
        </li>`).join('')

      caja.innerHTML = `
        <div class="gl-inicio-cab">
          <h2 class="gl-inicio-titulo" id="tituloGl">${icono('i-trofeo')}Gym Levels <span>· ${mes}</span></h2>
          <a class="gl-ver" href="gym-levels.html">Ver ranking${icono('i-chevron')}</a>
        </div>
        <div class="gl-inicio-cuerpo">
          ${d.filas.length
            ? `<ol class="gl-top">${top}</ol>`
            : `<div class="gl-vacio"><strong>Todavía nadie entrenó este mes</strong>Cuando los socios ingresen con su DNI, el ranking se arma solo.</div>`}
          <div class="gl-lado">
            <div class="gl-numeros">
              <div class="gl-numero"><span>Entrenaron en ${mes}</span><strong>${d.socios_mes}</strong></div>
              <div class="gl-numero"><span>Ingresos hoy</span><strong>${d.ingresos_hoy}</strong></div>
            </div>
            <div class="gl-niveles">
              ${['diamante', 'oro', 'plata', 'bronce'].map(k => `
                <div class="gl-nivel nivel-${k}">
                  ${escudoNivel(k, 24)}
                  <div><strong>${d.por_nivel[k]}</strong>${NIVELES[k].nombre}</div>
                </div>`).join('')}
            </div>
          </div>
        </div>`
      caja.hidden = false
    }

    document.getElementById('btnSalir').addEventListener('click', async () => {
      await db.auth.signOut()
      window.location.href = 'login.html'
    })

    // Si el logo no carga, lo ocultamos para no mostrar un ícono roto
    document.querySelectorAll('img[src="leon.webp"]').forEach(img => {
      img.addEventListener('error', () => { img.style.display = 'none' })
    })

    renderizarNavegacion()
    renderizarModulos()
    verificarAcceso()
  </script>
</body>
</html>
