<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#141213">
  <title>Gym Levels | Lion Gym Paraná</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ============================================================
       TOKENS DE DISEÑO — se van a mover a css/tokens.css cuando
       rediseñemos el resto de las páginas.
       ============================================================ */
    :root {
      --fondo: #141213;
      --superficie: #1b1819;
      --elevada: #241f21;
      --linea: #2f292b;
      --linea-suave: #231e20;
      --texto: #f3f0ef;
      --texto-2: #a39a9c;
      --texto-3: #736b6d;
      --rojo: #cc0000;
      --rojo-hover: #e00b0b;
      --rojo-texto: #ff5a52;

      --f-titulo: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
      --f-texto: 'Barlow', 'Segoe UI', system-ui, sans-serif;

      --ancho-lateral: 248px;
      --radio: 6px;
      --transicion: 160ms ease;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: var(--f-texto);
      font-size: 16px;
      line-height: 1.5;
      background: var(--fondo);
      color: var(--texto);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
    svg { flex-shrink: 0; }

    :focus-visible {
      outline: 2px solid var(--rojo-texto);
      outline-offset: 2px;
      border-radius: 2px;
    }

    /* Mientras se verifica la sesión no mostramos nada */
    body.verificando .app { visibility: hidden; }

    .icono {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ============================================================
       ESTRUCTURA
       ============================================================ */
    .app {
      display: grid;
      grid-template-columns: var(--ancho-lateral) 1fr;
      min-height: 100vh;
    }

    /* ---------- Barra lateral ---------- */
    .lateral {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--superficie);
      border-right: 1px solid var(--linea);
      padding: 1.5rem 0 1.25rem;
      overflow-y: auto;
    }

    .marca {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0 1.25rem 1.5rem;
    }

    .marca img {
      width: 44px;
      height: 44px;
      object-fit: contain;
    }

    .marca-nombre {
      font-family: var(--f-titulo);
      font-weight: 700;
      font-size: 1.45rem;
      letter-spacing: 0.06em;
      line-height: 1;
      color: var(--rojo);
    }

    .marca-lugar {
      font-size: 0.8rem;
      color: var(--texto-2);
      margin-top: 0.2rem;
    }

    .nav { flex: 1; }

    .nav-grupo { padding: 0.9rem 0 0.4rem; }

    .nav-grupo-titulo {
      font-family: var(--f-titulo);
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
      color: var(--texto-3);
      padding: 0 1.25rem 0.35rem;
    }

    .nav-link {
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.55rem 1.25rem;
      font-size: 0.95rem;
      color: var(--texto-2);
      transition: color var(--transicion), background var(--transicion);
    }

    .nav-link:hover { color: var(--texto); background: var(--elevada); }

    .nav-link[aria-current="page"] {
      color: var(--texto);
      background: var(--elevada);
    }

    .nav-link[aria-current="page"]::before {
      content: '';
      position: absolute;
      left: 0;
      top: 6px;
      bottom: 6px;
      width: 3px;
      background: var(--rojo);
    }

    .lateral-pie {
      border-top: 1px solid var(--linea);
      padding: 1rem 1.25rem 0;
      margin-top: 1rem;
    }

    .admin-nombre {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .admin-rol {
      font-size: 0.8rem;
      color: var(--texto-3);
      margin-bottom: 0.75rem;
    }

    .btn-salir {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.9rem;
      color: var(--texto-2);
      padding: 0.35rem 0;
      transition: color var(--transicion);
    }

    .btn-salir:hover { color: var(--rojo-texto); }

    /* ---------- Barra superior e inferior (solo celular) ---------- */
    .barra-movil,
    .nav-inferior,
    .velo { display: none; }

    /* ============================================================
       PÁGINA INTERNA
       ============================================================ */
    .principal {
      min-width: 0;
      padding: 0 clamp(1.25rem, 3.5vw, 3rem) 7rem;
    }

    .contenido { max-width: 1240px; }

    /* Evita que el contenido ancho empuje la página hacia los costados */
    .principal-wrap,
    .espacio > * { min-width: 0; }

    .oculto { display: none !important; }

    /* ---------- Encabezado de página (león gris) ---------- */
    .encabezado {
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1.5rem;
      padding: clamp(2rem, 5vh, 3.25rem) 0 2rem;
      overflow: hidden;
    }

    .encabezado-leon {
      position: absolute;
      right: 180px;
      top: 50%;
      width: 300px;
      transform: translateY(-50%);
      opacity: 0.07;
      filter: grayscale(1) brightness(1.6);
      clip-path: inset(0 0 7% 0);
      pointer-events: none;
      user-select: none;
    }

    .encabezado-texto { position: relative; }

    .antetitulo {
      font-size: 0.95rem;
      color: var(--texto-2);
      margin-bottom: 0.25rem;
    }

    .titulo-pagina {
      font-family: var(--f-titulo);
      font-weight: 700;
      font-size: clamp(2.6rem, 5vw, 3.6rem);
      line-height: 0.95;
    }

    .bajada {
      color: var(--texto-2);
      margin-top: 0.6rem;
      max-width: 46ch;
    }

    .trazo {
      display: block;
      width: 72px;
      height: 6px;
      margin-top: 1.1rem;
      background: var(--rojo);
      transform: skewX(-24deg);
    }

    /* ---------- Botones ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      height: 44px;
      padding: 0 1.1rem;
      border-radius: var(--radio);
      border: 1px solid var(--linea);
      background: var(--superficie);
      font-weight: 600;
      font-size: 0.95rem;
      white-space: nowrap;
      transition: background var(--transicion), border-color var(--transicion), color var(--transicion);
    }

    .btn:hover { background: var(--elevada); border-color: #4a3f42; }
    .btn .icono { width: 18px; height: 18px; }

    .btn-primario {
      background: var(--rojo);
      border-color: var(--rojo);
      color: #fff;
    }

    .btn-primario:hover { background: var(--rojo-hover); border-color: var(--rojo-hover); }

    .btn-primario:disabled {
      background: var(--elevada);
      border-color: var(--linea);
      color: var(--texto-3);
      cursor: wait;
    }

    .btn-fantasma {
      background: none;
      border-color: transparent;
      color: var(--texto-2);
    }

    .btn-fantasma:hover { background: var(--elevada); color: var(--texto); border-color: transparent; }

    .btn-icono {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: var(--radio);
      color: var(--texto-3);
      transition: color var(--transicion), background var(--transicion);
    }

    .btn-icono:hover { color: var(--texto); background: var(--elevada); }
    .btn-icono.peligro:hover { color: var(--rojo-texto); background: rgba(204, 0, 0, 0.12); }
    .btn-icono .icono { width: 17px; height: 17px; }
    .btn-icono:disabled { opacity: 0.3; pointer-events: none; }


    /* ============================================================
       GYM LEVELS (panel)
       ============================================================ */
    .nivel-bronce   { --n-claro: #e7ab74; --n-medio: #b8733a; --n-oscuro: #6e3c18; }
    .nivel-plata    { --n-claro: #f4f6f9; --n-medio: #b9bfc7; --n-oscuro: #69707a; }
    .nivel-oro      { --n-claro: #ffe594; --n-medio: #e0b043; --n-oscuro: #8c6417; }
    .nivel-diamante { --n-claro: #d2f5ff; --n-medio: #63c3ef; --n-oscuro: #1f5f9e; }
    .escudo { display: block; flex: none; }

    .selector-mes {
      position: relative;
      height: 44px;
      padding: 0 0.9rem;
      font: inherit;
      font-weight: 600;
      color: var(--texto);
      background: var(--superficie);
      border: 1px solid var(--linea);
      border-radius: var(--radio);
      color-scheme: dark;
    }

    /* Números del mes */
    .resumen-gl {
      display: grid;
      grid-template-columns: 1.2fr 1.2fr repeat(4, 1fr);
      gap: 0.6rem;
      margin-bottom: 1.5rem;
    }

    .dato-gl {
      padding: 1rem 1.1rem;
      border-radius: 10px;
      background: var(--superficie);
      border: 1px solid var(--linea);
      min-width: 0;
    }

    .dato-gl-nombre { font-size: 0.82rem; color: var(--texto-3); }

    .dato-gl-valor {
      font-family: var(--f-titulo);
      font-weight: 700;
      font-size: 2.3rem;
      line-height: 1.05;
      font-variant-numeric: tabular-nums;
    }

    .dato-gl-extra { font-size: 0.8rem; color: var(--texto-3); }

    .dato-gl.nivel {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      border-top: 3px solid var(--n-medio);
    }

    .dato-gl.nivel .dato-gl-valor { color: var(--n-claro); }

    /* Podio */
    .podio {
      display: grid;
      grid-template-columns: 1fr 1.15fr 1fr;
      align-items: end;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .podio-lugar {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 1.25rem 1rem 1.1rem;
      border-radius: 12px;
      border: 1px solid var(--linea);
      background:
        radial-gradient(ellipse 70% 80% at 50% 0%, color-mix(in srgb, var(--n-medio) 20%, transparent), transparent 70%),
        var(--superficie);
      min-width: 0;
    }

    .podio-lugar::before {
      content: '';
      position: absolute;
      left: 0; right: 0; top: 0;
      height: 3px;
      border-radius: 12px 12px 0 0;
      background: linear-gradient(90deg, var(--n-oscuro), var(--n-claro), var(--n-medio));
    }

    .podio-lugar.p1 { padding-top: 1.75rem; padding-bottom: 1.5rem; }

    .podio-medalla {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      font-family: var(--f-titulo);
      font-weight: 700;
      font-size: 1.6rem;
      color: #1b1819;
      background: radial-gradient(circle at 35% 30%, var(--n-claro), var(--n-medio) 55%, var(--n-oscuro));
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
    }

    .podio-lugar.p1 .podio-medalla { width: 64px; height: 64px; font-size: 2rem; }

    .podio-nombre {
      margin-top: 0.7rem;
      font-weight: 600;
      font-size: 1.05rem;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .podio-alias { font-size: 0.82rem; color: var(--texto-3); min-height: 1.2em; }

    .podio-dias {
      margin-top: 0.4rem;
      font-family: var(--f-titulo);
      font-weight: 700;
      font-size: 2.2rem;
      line-height: 1;
    }

    .podio-lugar.p1 .podio-dias { font-size: 2.8rem; }
    .podio-dias small { font-family: var(--f-texto); font-size: 0.85rem; font-weight: 500; color: var(--texto-2); margin-left: 0.2rem; }

    .podio-nivel { display: inline-flex; align-items: center; gap: 0.35rem; margin-top: 0.35rem; font-size: 0.82rem; color: var(--texto-2); }

    /* Tabla del ranking */
    .tarjeta {
      border-radius: 12px;
      border: 1px solid var(--linea);
      background: var(--superficie);
      overflow: hidden;
    }

    .tarjeta-cab {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--linea);
    }

    .tarjeta-titulo { font-family: var(--f-titulo); font-weight: 600; font-size: 1.4rem; line-height: 1.1; }
    .tarjeta-sub { font-size: 0.85rem; color: var(--texto-3); }

    .buscar-gl {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      height: 40px;
      padding: 0 0.8rem;
      min-width: min(280px, 100%);
      border-radius: var(--radio);
      border: 1px solid var(--linea);
      background: var(--fondo);
      color: var(--texto-3);
    }

    .buscar-gl:focus-within { border-color: var(--rojo); }
    .buscar-gl .icono { width: 17px; height: 17px; }
    .buscar-gl input { flex: 1; min-width: 0; height: 100%; border: none; outline: none; background: none; font: inherit; color: var(--texto); }

    .tabla-gl { width: 100%; border-collapse: collapse; }

    .tabla-gl th {
      text-align: left;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--texto-3);
      padding: 0.7rem 1rem;
      border-bottom: 1px solid var(--linea);
      white-space: nowrap;
    }

    .tabla-gl td {
      padding: 0.65rem 1rem;
      border-bottom: 1px solid var(--linea-suave);
      vertical-align: middle;
    }

    .tabla-gl tr:last-child td { border-bottom: none; }
    .tabla-gl tbody tr:hover td { background: rgba(255, 255, 255, 0.02); }
    .tabla-gl .num { text-align: right; font-variant-numeric: tabular-nums; }

    .puesto {
      display: grid;
      place-items: center;
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
      font-family: var(--f-titulo);
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--texto-2);
    }

    .puesto.medalla {
      color: #1b1819;
      background: radial-gradient(circle at 35% 30%, var(--n-claro), var(--n-medio) 55%, var(--n-oscuro));
    }

    .socio-celda { display: flex; flex-direction: column; min-width: 0; }
    .socio-nombre { font-weight: 600; text-transform: capitalize; }
    .socio-alias { font-size: 0.82rem; color: var(--texto-3); }

    .etiqueta {
      display: inline-block;
      margin-left: 0.4rem;
      padding: 0.05rem 0.45rem;
      border-radius: 99px;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--texto-2);
      background: rgba(255, 255, 255, 0.07);
      vertical-align: 1px;
      text-transform: none;
    }

    .nivel-celda { display: inline-flex; align-items: center; gap: 0.45rem; font-size: 0.9rem; color: var(--texto-2); }

    .dias-celda {
      font-family: var(--f-titulo);
      font-weight: 700;
      font-size: 1.35rem;
    }

    .barra-dias {
      display: block;
      height: 4px;
      margin-top: 0.25rem;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--n-oscuro), var(--n-medio));
    }

    .vacio-gl {
      padding: 2.5rem 1.25rem;
      text-align: center;
      color: var(--texto-3);
    }

    .vacio-gl strong { display: block; color: var(--texto); font-size: 1.1rem; margin-bottom: 0.3rem; }

    .nota-gl { margin-top: 1rem; font-size: 0.85rem; color: var(--texto-3); }

    @media (max-width: 1180px) {
      .resumen-gl { grid-template-columns: 1fr 1fr repeat(2, 1fr); }
      .encabezado-leon { right: 40px; }
    }

    @media (max-width: 820px) {
      .resumen-gl { grid-template-columns: 1fr 1fr; }
      .dato-gl-valor { font-size: 2rem; }
      .podio { grid-template-columns: 1fr 1fr 1fr; gap: 0.4rem; }
      .podio-lugar { padding: 1rem 0.4rem 0.9rem; }
      .podio-lugar.p1 { padding-top: 1.25rem; }
      .podio-medalla { width: 40px; height: 40px; font-size: 1.25rem; }
      .podio-lugar.p1 .podio-medalla { width: 48px; height: 48px; font-size: 1.5rem; }
      .podio-nombre { font-size: 0.9rem; }
      .podio-dias { font-size: 1.7rem; }
      .podio-lugar.p1 .podio-dias { font-size: 2.1rem; }
      .podio-nivel span { display: none; }
      .tabla-gl .col-puntos, .tabla-gl .col-ultimo, .tabla-gl .col-nivel-texto { display: none; }
      .tabla-gl td, .tabla-gl th { padding-left: 0.6rem; padding-right: 0.6rem; }
      .buscar-gl { min-width: 100%; }
    }

    /* ============================================================
       CELULAR
       ============================================================ */
    @media (max-width: 820px) {
      .app { grid-template-columns: 1fr; }

      .lateral {
        position: fixed;
        z-index: 40;
        left: 0;
        top: 0;
        width: min(84vw, 300px);
        transform: translateX(-100%);
        transition: transform 220ms ease;
        padding-top: calc(1.5rem + env(safe-area-inset-top));
      }

      body.menu-abierto .lateral { transform: translateX(0); }

      .velo {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 30;
        background: rgba(0,0,0,0.6);
        opacity: 0;
        pointer-events: none;
        transition: opacity 220ms ease;
      }

      body.menu-abierto .velo { opacity: 1; pointer-events: auto; }

      .barra-movil {
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 20;
        padding: calc(0.75rem + env(safe-area-inset-top)) 1.25rem 0.75rem;
        background: rgba(20,18,19,0.94);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--linea);
      }

      .barra-movil .marca { padding: 0; gap: 0.6rem; }
      .barra-movil .marca img { width: 34px; height: 34px; }
      .barra-movil .marca-nombre { font-size: 1.25rem; }

      .principal { padding-bottom: calc(5rem + env(safe-area-inset-bottom)); }

      .encabezado { flex-direction: column; align-items: flex-start; padding: 1.75rem 0 1.5rem; }
      .encabezado-leon { width: 200px; right: -60px; }


      .nav-inferior {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        position: fixed;
        z-index: 20;
        left: 0;
        right: 0;
        bottom: 0;
        padding-bottom: env(safe-area-inset-bottom);
        background: rgba(27,24,25,0.97);
        backdrop-filter: blur(8px);
        border-top: 1px solid var(--linea);
      }

      .nav-inferior a,
      .nav-inferior button {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.2rem;
        min-height: 60px;
        font-size: 0.72rem;
        color: var(--texto-2);
      }

      .nav-inferior [aria-current="page"] { color: var(--texto); }
      .nav-inferior [aria-current="page"] .icono { color: var(--rojo-texto); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body class="verificando">

  <div class="app">

    <!-- ============ BARRA LATERAL ============ -->
    <aside class="lateral" id="lateral" aria-label="Navegación principal">
      <a class="marca" href="index.html">
        <img src="leon.webp" alt="">
        <div>
          <div class="marca-nombre">LION GYM</div>
          <div class="marca-lugar">Paraná</div>
        </div>
      </a>

      <nav class="nav" id="navLateral"></nav>

      <div class="lateral-pie">
        <div class="admin-nombre" id="adminNombre"></div>
        <div class="admin-rol">Administrador</div>
        <button class="btn-salir" id="btnSalir" type="button">
          <svg class="icono" viewBox="0 0 24 24"><use href="#i-salir"/></svg>
          Cerrar sesión
        </button>
      </div>
    </aside>

    <div class="velo" id="velo"></div>

    <div class="principal-wrap">

      <header class="barra-movil">
        <a class="marca" href="index.html">
          <img src="leon.webp" alt="">
          <div class="marca-nombre">LION GYM</div>
        </a>
      </header>

      <main class="principal">
        <div class="contenido">
          <!-- Encabezado -->
          <section class="encabezado">
            <img class="encabezado-leon" src="leon.webp" alt="" aria-hidden="true">
            <div class="encabezado-texto">

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <script>
    const SUPABASE_URL = 'https://hlhsrbstxxdanyckujem.supabase.co'
    const SUPABASE_KEY = 'sb_publishable_NOA6FfVrGTtkX0eu_rvyZA_Uyye2XRl'
    const { createClient } = supabase
    const db = createClient(SUPABASE_URL, SUPABASE_KEY)

    /* ============================================================
       NAVEGACIÓN (misma lista de módulos que index.html)
       ============================================================ */
    const MODULOS = [
      { titulo: 'Socios', items: [
        { nombre: 'Listado de socios', href: 'panel-general.html', icono: 'i-usuarios' },
        { nombre: 'Alta de socio', href: 'alta-socio.html', icono: 'i-usuario-mas' },
        { nombre: 'Editar socio', href: 'editar-socio.html', icono: 'i-usuario-editar' }
      ]},
      { titulo: 'Pagos y caja', items: [
        { nombre: 'Registrar pago', href: 'registro-pagos.html', icono: 'i-pago' },
        { nombre: 'Caja', href: 'caja.html', icono: 'i-caja' },
        { nombre: 'Planes y precios', href: 'planes.html', icono: 'i-planes' }
      ]},
      { titulo: 'Entrenamiento', items: [
        { nombre: 'Rutinas', href: 'rutinas.html', icono: 'i-rutinas' },
        { nombre: 'Plantillas de rutina', href: 'plantillas.html', icono: 'i-plantillas' },
        { nombre: 'Gym Levels', href: 'gym-levels.html', icono: 'i-trofeo' }
      ]}
    ]

    const PAGINA_ACTUAL = 'gym-levels.html'
    const icono = (id, clase = 'icono') => `<svg class="${clase}" viewBox="0 0 24 24"><use href="#${id}"/></svg>`
    const actual = href => href === PAGINA_ACTUAL ? ' aria-current="page"' : ''

    document.getElementById('navLateral').innerHTML = `
      <div class="nav-grupo">
        <a class="nav-link" href="index.html">${icono('i-inicio')}Inicio</a>
        <a class="nav-link" href="recepcion.html">${icono('i-recepcion')}Recepción</a>
      </div>` + MODULOS.map(g => `
      <div class="nav-grupo">
        <div class="nav-grupo-titulo">${g.titulo}</div>
        ${g.items.map(i => `<a class="nav-link" href="${i.href}"${actual(i.href)}>${icono(i.icono)}${i.nombre}</a>`).join('')}
      </div>`).join('')

    const btnMenu = document.getElementById('btnMenu')
    function alternarMenu(abrir) {
      document.body.classList.toggle('menu-abierto', abrir)
      btnMenu.setAttribute('aria-expanded', String(abrir))
    }
    btnMenu.addEventListener('click', () => alternarMenu(!document.body.classList.contains('menu-abierto')))
    document.getElementById('velo').addEventListener('click', () => alternarMenu(false))
    document.addEventListener('keydown', e => { if (e.key === 'Escape') alternarMenu(false) })

    document.getElementById('btnSalir').addEventListener('click', cerrarSesion)


    const escapar = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))

    /* ============================================================
       ACCESO
       ============================================================ */
    async function verificarAcceso() {
      const { data } = await db.auth.getSession()
      if (!data.session) {
        window.location.href = 'login.html'
        return
      }
      const { data: admin } = await db
        .from('administradores')
        .select('nombre')
        .eq('id', data.session.user.id)
        .eq('activo', true)
        .limit(1)

      if (!admin || admin.length === 0) {
        await db.auth.signOut()
        window.location.href = 'login.html'
        return
      }

      document.getElementById('adminNombre').textContent = admin[0].nombre || 'Administrador'
      document.body.classList.remove('verificando')
      cargarGl()
    }

    async function cerrarSesion() {
      await db.auth.signOut()
      window.location.href = 'login.html'
    }

    /* ============================================================
       GYM LEVELS — panel del profe
       Datos: gym_levels_admin(mes) (migración 009). Solo administradores.
       ============================================================ */
    const NIVELES = {
      bronce:   { nombre: 'Bronce',   claro: '#e7ab74', medio: '#b8733a', oscuro: '#6e3c18' },
      plata:    { nombre: 'Plata',    claro: '#f4f6f9', medio: '#b9bfc7', oscuro: '#69707a' },
      oro:      { nombre: 'Oro',      claro: '#ffe594', medio: '#e0b043', oscuro: '#8c6417' },
      diamante: { nombre: 'Diamante', claro: '#d2f5ff', medio: '#63c3ef', oscuro: '#1f5f9e' }
    }
    const MEDALLA = { 1: 'oro', 2: 'plata', 3: 'bronce' }
    let idSvg = 0

    function escudoNivel(nivel, tam = 64) {
      const n = NIVELES[nivel] || NIVELES.bronce
      const id = 'esc-' + (++idSvg)
      const galon = y => `<path d="M20 ${y} 32 ${y + 7} 44 ${y}" fill="none" stroke="${n.oscuro}" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>`
      const marcas = {
        bronce: galon(33), plata: galon(28) + galon(38), oro: galon(23) + galon(33) + galon(43),
        diamante: `<path d="M23 27h18l5 7-14 16-14-16z" fill="${n.claro}" stroke="${n.oscuro}" stroke-width="2.2" stroke-linejoin="round"/><path d="M18 34h28M27 27l-2 7 7 16 7-16-2-7" fill="none" stroke="${n.oscuro}" stroke-width="1.6" stroke-linejoin="round"/>`
      }
      return `<svg class="escudo" width="${tam}" height="${Math.round(tam * 1.125)}" viewBox="0 0 64 72" aria-hidden="true">
        <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${n.claro}"/><stop offset=".55" stop-color="${n.medio}"/><stop offset="1" stop-color="${n.oscuro}"/></linearGradient></defs>
        <path d="M32 3 58 12v24c0 16-12 27-26 33C18 63 6 52 6 36V12z" fill="url(#${id})" stroke="${n.oscuro}" stroke-width="1.5"/>
        <path d="M32 9.5 52.5 16.5v19.5c0 12.5-9 21.5-20.5 26.5-11.5-5-20.5-14-20.5-26.5V16.5z" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1.2"/>
        <path d="M32 3 58 12v8L6 44V12z" fill="rgba(255,255,255,.14)"/>${marcas[nivel] || marcas.bronce}</svg>`
    }

    const MESES_GL = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre']
    const nombreBonito = t => String(t || '').toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase())
    const plural = (n, uno, varios) => `${n} ${n === 1 ? uno : varios}`

    function haceCuanto(iso) {
      if (!iso) return ''
      const hoy = new Date(); hoy.setHours(0, 0, 0, 0)
      const d = Math.round((hoy - new Date(iso + 'T00:00:00')) / 86400000)
      return d <= 0 ? 'Hoy' : d === 1 ? 'Ayer' : `Hace ${d} días`
    }

    // Selector: este mes y los 11 anteriores
    const selectorMes = document.getElementById('selectorMes')
    ;(() => {
      const hoy = new Date()
      for (let i = 0; i < 12; i++) {
        const d = new Date(hoy.getFullYear(), hoy.getMonth() - i, 1)
        const valor = i === 0 ? '' : `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-01`
        const texto = i === 0 ? `Este mes (${MESES_GL[d.getMonth()]})` : `${MESES_GL[d.getMonth()].replace(/^./, c => c.toUpperCase())} ${d.getFullYear()}`
        selectorMes.insertAdjacentHTML('beforeend', `<option value="${valor}">${texto}</option>`)
      }
    })()
    selectorMes.addEventListener('change', () => cargarGl())

    let datosGl = null
    let filtroGl = ''

    async function cargarGl() {
      const cont = document.getElementById('contenidoGl')
      const { data, error } = await db.rpc('gym_levels_admin', { p_mes: selectorMes.value || null })
      if (error) {
        console.warn(error.message)
        cont.innerHTML = `<div class="tarjeta vacio-gl"><strong>Gym Levels todavía no está disponible</strong>
          Falta aplicar en Supabase la migración 009 (gym_levels_admin).</div>`
        return
      }
      datosGl = data
      renderizarGl()
    }

    function renderizarGl() {
      const d = datosGl
      const cont = document.getElementById('contenidoGl')
      const mes = new Date(d.mes + 'T00:00:00')
      const nombreMes = MESES_GL[mes.getMonth()]

      const datoNivel = k => `
        <div class="dato-gl nivel nivel-${k}">
          ${escudoNivel(k, 34)}
          <div>
            <div class="dato-gl-nombre">${NIVELES[k].nombre}</div>
            <div class="dato-gl-valor">${d.por_nivel[k]}</div>
          </div>
        </div>`

      const resumen = `
        <div class="resumen-gl">
          <div class="dato-gl">
            <div class="dato-gl-nombre">Entrenaron en ${nombreMes}</div>
            <div class="dato-gl-valor">${d.socios_mes}</div>
            <div class="dato-gl-extra">socios con al menos un día</div>
          </div>
          <div class="dato-gl">
            <div class="dato-gl-nombre">Ingresos hoy</div>
            <div class="dato-gl-valor">${d.ingresos_hoy}</div>
            <div class="dato-gl-extra">socios distintos</div>
          </div>
          ${['diamante', 'oro', 'plata', 'bronce'].map(datoNivel).join('')}
        </div>`

      if (!d.filas.length) {
        cont.innerHTML = resumen + `<div class="tarjeta vacio-gl"><strong>Sin ingresos en ${nombreMes}</strong>
          Cuando los socios ingresen con su DNI en Recepción, el ranking se arma solo.</div>`
        return
      }

      // Podio: los 3 primeros (orden visual 2 - 1 - 3)
      const top = d.filas.slice(0, 3)
      const lugar = (f, i) => {
        if (!f) return '<div></div>'
        const medalla = MEDALLA[i + 1]
        return `
          <div class="podio-lugar p${i + 1} nivel-${medalla}">
            <div class="podio-medalla nivel-${medalla}">${f.puesto}</div>
            <div class="podio-nombre" title="${escapar(nombreBonito(f.nombre))}">${escapar(nombreBonito(f.nombre))}</div>
            <div class="podio-alias">${f.alias ? escapar(f.alias) : ''}</div>
            <div class="podio-dias">${f.dias}<small>${f.dias === 1 ? 'día' : 'días'}</small></div>
            <div class="podio-nivel nivel-${f.nivel}">${escudoNivel(f.nivel, 18)}<span>${NIVELES[f.nivel].nombre}</span></div>
          </div>`
      }
      const podio = `<div class="podio">${lugar(top[1], 1)}${lugar(top[0], 0)}${lugar(top[2], 2)}</div>`

      cont.innerHTML = resumen + podio + `
        <section class="tarjeta">
          <div class="tarjeta-cab">
            <div>
              <h2 class="tarjeta-titulo">Ranking de ${nombreMes}</h2>
              <p class="tarjeta-sub">${plural(d.filas.length, 'socio', 'socios')} · ordenado por días entrenados</p>
            </div>
            <label class="buscar-gl">
              <svg class="icono" viewBox="0 0 24 24"><use href="#i-buscar"/></svg>
              <input type="search" id="buscarGl" placeholder="Buscar socio" value="${escapar(filtroGl)}" aria-label="Buscar socio">
            </label>
          </div>
          <table class="tabla-gl">
            <thead>
              <tr>
                <th style="width:3.5rem">#</th>
                <th>Socio</th>
                <th>Nivel</th>
                <th class="num">Días</th>
                <th class="num col-puntos">Puntos del mes</th>
                <th class="col-ultimo">Última vez</th>
              </tr>
            </thead>
            <tbody id="filasGl"></tbody>
          </table>
        </section>
        <p class="nota-gl">Los socios marcados como "oculto" eligieron no aparecer en el ranking que ven los alumnos; acá los ves igual.
        ${d.excluidos ? ` ${plural(d.excluidos, 'socio está excluido', 'socios están excluidos')} de Gym Levels y no figuran.` : ''}</p>`

      renderizarFilas()
      document.getElementById('buscarGl').addEventListener('input', e => { filtroGl = e.target.value; renderizarFilas() })
    }

    function renderizarFilas() {
      const d = datosGl
      const tope = Math.max(d.niveles.diamante, ...d.filas.map(f => f.dias))
      const q = filtroGl.trim().toLowerCase()
      const filas = d.filas.filter(f => !q || (f.nombre || '').toLowerCase().includes(q) || (f.alias || '').toLowerCase().includes(q))
      const tbody = document.getElementById('filasGl')
      if (!filas.length) {
        tbody.innerHTML = `<tr><td colspan="6" class="vacio-gl">No hay socios que coincidan con "${escapar(filtroGl)}".</td></tr>`
        return
      }
      tbody.innerHTML = filas.map(f => {
        const medalla = MEDALLA[f.puesto]
        return `
          <tr>
            <td><span class="puesto${medalla ? ` medalla nivel-${medalla}` : ''}">${f.puesto}</span></td>
            <td>
              <div class="socio-celda">
                <span class="socio-nombre">${escapar(nombreBonito(f.nombre))}${f.oculto ? '<span class="etiqueta">oculto</span>' : ''}${f.activo ? '' : '<span class="etiqueta">inactivo</span>'}</span>
                <span class="socio-alias">${f.alias ? `Aparece como ${escapar(f.alias)}` : `Aparece como ${escapar(f.nombre_publico)}`}</span>
              </div>
            </td>
            <td><span class="nivel-celda">${escudoNivel(f.nivel, 22)}<span class="col-nivel-texto">${NIVELES[f.nivel].nombre}</span></span></td>
            <td class="num nivel-${f.nivel}">
              <span class="dias-celda">${f.dias}</span>
              <span class="barra-dias" style="width:${Math.max(6, (f.dias / tope) * 100)}%;margin-left:auto"></span>
            </td>
            <td class="num col-puntos">${Number(f.puntos).toLocaleString('es-AR')}</td>
            <td class="col-ultimo">${haceCuanto(f.ultimo)}</td>
          </tr>`
      }).join('')
    }

    verificarAcceso()
  </script>
</body>
