<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#141213">
  <title>Iniciar sesión | Lion Gym Paraná</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ============================================================
       TOKENS DE DISEÑO — mismos valores que index.html
       ============================================================ */
    :root {
      --fondo: #141213;
      --superficie: #1b1819;
      --elevada: #241f21;
      --linea: #2f292b;
      --texto: #f3f0ef;
      --texto-2: #a39a9c;
      --texto-3: #736b6d;
      --rojo: #cc0000;
      --rojo-hover: #e00b0b;
      --rojo-texto: #ff5a52;

      --f-titulo: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
      --f-texto: 'Barlow', 'Segoe UI', system-ui, sans-serif;

      --radio: 6px;
      --transicion: 160ms ease;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--f-texto);
      font-size: 16px;
      line-height: 1.5;
      background: var(--fondo);
      color: var(--texto);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; }
    button { font: inherit; cursor: pointer; }

    :focus-visible {
      outline: 2px solid var(--rojo-texto);
      outline-offset: 2px;
    }

    .icono {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ============================================================
       ESTRUCTURA: marca a la izquierda, formulario a la derecha
       ============================================================ */
    .pantalla {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      min-height: 100vh;
    }

    /* ---------- Panel de marca ---------- */
    .marca-panel {
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(2rem, 5vw, 4rem);
      background:
        radial-gradient(circle at 50% 42%, rgba(204, 0, 0, 0.22) 0%, rgba(204, 0, 0, 0.06) 34%, transparent 62%),
        var(--superficie);
      border-right: 1px solid var(--linea);
    }

    /* Líneas diagonales finas, como la textura de un piso de goma */
    .marca-panel::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(-60deg, rgba(255,255,255,0.028) 0 1px, transparent 1px 14px);
      -webkit-mask-image: radial-gradient(circle at 50% 42%, #000 0%, transparent 70%);
              mask-image: radial-gradient(circle at 50% 42%, #000 0%, transparent 70%);
      pointer-events: none;
    }

    /* Franja roja inclinada en el borde inferior */
    .marca-panel::after {
      content: '';
      position: absolute;
      left: -10%;
      right: -10%;
      bottom: 0;
      height: 6px;
      background: var(--rojo);
      transform: skewY(-1.2deg);
      transform-origin: left;
    }

    .marca-leon {
      position: relative;
      width: clamp(190px, 26vw, 330px);
      aspect-ratio: 1;
      object-fit: contain;
      filter: drop-shadow(0 0 36px rgba(204, 0, 0, 0.55));
      /* El archivo del logo trae un texto chico debajo del león: lo recortamos */
      clip-path: inset(0 0 7% 0);
      margin-bottom: 0.75rem;
      animation: aparecer 700ms cubic-bezier(.2,.8,.2,1) both;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: scale(0.94); }
      to   { opacity: 1; transform: scale(1); }
    }

    .marca-nombre {
      position: relative;
      font-family: var(--f-titulo);
      font-weight: 700;
      font-size: clamp(3rem, 6.5vw, 5.25rem);
      line-height: 0.9;
      letter-spacing: 0.05em;
      color: var(--rojo);
    }

    .marca-lugar {
      position: relative;
      font-family: var(--f-titulo);
      font-weight: 500;
      font-size: clamp(1.3rem, 2.2vw, 1.75rem);
      letter-spacing: 0.3em;
      color: var(--texto-2);
      margin-top: 0.5rem;
      padding-left: 0.3em; /* compensa el espaciado para que quede centrado */
    }

    .lema {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 2.25rem;
      font-family: var(--f-titulo);
      font-weight: 500;
      font-size: 1.35rem;
      letter-spacing: 0.02em;
      color: var(--texto-2);
    }

    /* ---------- Formulario ---------- */
    .form-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem clamp(1.25rem, 5vw, 4rem);
    }

    .form-caja {
      width: 100%;
      max-width: 380px;
    }

    .titulo {
      font-family: var(--f-titulo);
      font-weight: 700;
      font-size: 2.4rem;
      line-height: 1;
    }

    .bajada {
      color: var(--texto-2);
      margin: 0.5rem 0 2rem;
    }

    .campo { margin-bottom: 1.1rem; }

    .campo label {
      display: block;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--texto-2);
      margin-bottom: 0.4rem;
    }

    .control {
      position: relative;
      display: flex;
      align-items: center;
    }

    .control input {
      width: 100%;
      height: 50px;
      padding: 0 1rem;
      font: inherit;
      font-size: 1rem;
      color: var(--texto);
      background: var(--superficie);
      border: 1px solid var(--linea);
      border-radius: var(--radio);
      outline: none;
      transition: border-color var(--transicion), background var(--transicion);
    }

    .control input::placeholder { color: var(--texto-3); }

    .control input:hover { border-color: #463c3f; }

    .control input:focus {
      border-color: var(--rojo);
      background: var(--elevada);
    }

    .control input.con-boton { padding-right: 3.25rem; }

    .btn-ver {
      position: absolute;
      right: 4px;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      background: none;
      border: none;
      border-radius: var(--radio);
      color: var(--texto-3);
      transition: color var(--transicion);
    }

    .btn-ver:hover { color: var(--texto); }

    .btn-ingresar {
      width: 100%;
      height: 52px;
      margin-top: 0.6rem;
      font-family: var(--f-titulo);
      font-weight: 600;
      font-size: 1.3rem;
      letter-spacing: 0.01em;
      color: #fff;
      background: var(--rojo);
      border: none;
      border-radius: var(--radio);
      transition: background var(--transicion);
    }

    .btn-ingresar:hover { background: var(--rojo-hover); }

    .btn-ingresar:disabled {
      background: var(--elevada);
      color: var(--texto-3);
      cursor: wait;
    }

    .mensaje {
      display: none;
      margin-top: 1rem;
      padding: 0.8rem 1rem;
      font-size: 0.92rem;
      line-height: 1.45;
      color: #ffb3ad;
      background: rgba(204, 0, 0, 0.1);
      border-left: 3px solid var(--rojo);
      border-radius: 0 var(--radio) var(--radio) 0;
    }

    .mensaje.visible { display: block; }

    .pie {
      margin-top: 2.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--linea);
      font-size: 0.9rem;
      color: var(--texto-3);
    }

    .pie a {
      color: var(--texto-2);
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-color: var(--texto-3);
      transition: color var(--transicion);
    }

    .pie a:hover { color: var(--texto); }

    /* ============================================================
       CELULAR: la marca pasa arriba, compacta
       ============================================================ */
    @media (max-width: 820px) {
      .pantalla {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
      }

      .marca-panel {
        padding: calc(2rem + env(safe-area-inset-top)) 1.5rem 2.25rem;
        border-right: none;
      }

      .marca-leon { width: 128px; margin-bottom: 1rem; }
      .marca-nombre { font-size: 3rem; }
      .marca-lugar { font-size: 1.2rem; }
      .lema { display: none; }

      .form-panel {
        align-items: flex-start;
        padding: 2rem 1.5rem calc(2rem + env(safe-area-inset-bottom));
      }

      .titulo { font-size: 2rem; }
      .bajada { margin-bottom: 1.5rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>

  <div class="pantalla">

    <section class="marca-panel">
      <img class="marca-leon" src="leon.webp" alt="Logo de Lion Gym">
      <div class="marca-nombre">LION GYM</div>
      <div class="marca-lugar">PARANÁ</div>
      <p class="lema">La mente es el límite.</p>
    </section>

    <main class="form-panel">
      <div class="form-caja">
        <h1 class="titulo">Iniciar sesión</h1>
        <p class="bajada">Acceso para administradores del gimnasio.</p>

        <form id="formLogin" novalidate>
          <div class="campo">
            <label for="email">Email</label>
            <div class="control">
              <input type="email" id="email" autocomplete="username" placeholder="nombre@correo.com" required autofocus>
            </div>
          </div>

          <div class="campo">
            <label for="password">Contraseña</label>
            <div class="control">
              <input type="password" id="password" class="con-boton" autocomplete="current-password" required>
              <button type="button" class="btn-ver" id="btnVer" aria-label="Mostrar contraseña" aria-pressed="false">
                <svg class="icono" viewBox="0 0 24 24" id="iconoOjo">
                  <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-ingresar" id="btnIngresar">Ingresar</button>
          <div class="mensaje" id="mensaje" role="alert"></div>
        </form>

        <p class="pie">¿Venís a entrenar? <a href="recepcion.html">Registrá tu ingreso en recepción</a></p>
      </div>
    </main>

  </div>

  <script>
    const SUPABASE_URL = 'https://hlhsrbstxxdanyckujem.supabase.co'
    const SUPABASE_KEY = 'sb_publishable_NOA6FfVrGTtkX0eu_rvyZA_Uyye2XRl'
    const { createClient } = supabase
    const db = createClient(SUPABASE_URL, SUPABASE_KEY)

    // A dónde va el administrador después de iniciar sesión
    const DESTINO = 'index.html'

    const form = document.getElementById('formLogin')
    const inputEmail = document.getElementById('email')
    const inputPassword = document.getElementById('password')
    const btnIngresar = document.getElementById('btnIngresar')
    const mensaje = document.getElementById('mensaje')

    // Si ya hay una sesión activa, directo al inicio
    async function verificarSesionExistente() {
      const { data } = await db.auth.getSession()
      if (data.session) window.location.href = DESTINO
    }
    verificarSesionExistente()

    function mostrarError(texto) {
      mensaje.textContent = texto
      mensaje.classList.add('visible')
    }

    function ocultarError() {
      mensaje.classList.remove('visible')
    }

    function estadoCargando(cargando) {
      btnIngresar.disabled = cargando
      btnIngresar.textContent = cargando ? 'Ingresando…' : 'Ingresar'
    }

    // Mostrar / ocultar contraseña
    const btnVer = document.getElementById('btnVer')
    const iconoOjo = document.getElementById('iconoOjo')
    const OJO_ABIERTO = '<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/>'
    const OJO_TACHADO = '<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/><path d="M4 20 20 4"/>'

    btnVer.addEventListener('click', () => {
      const mostrar = inputPassword.type === 'password'
      inputPassword.type = mostrar ? 'text' : 'password'
      iconoOjo.innerHTML = mostrar ? OJO_TACHADO : OJO_ABIERTO
      btnVer.setAttribute('aria-pressed', String(mostrar))
      btnVer.setAttribute('aria-label', mostrar ? 'Ocultar contraseña' : 'Mostrar contraseña')
    })

    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      ocultarError()

      const email = inputEmail.value.trim()
      const password = inputPassword.value

      if (!email || !password) {
        mostrarError('Completá el email y la contraseña.')
        ;(!email ? inputEmail : inputPassword).focus()
        return
      }

      estadoCargando(true)

      try {
        const { data, error } = await db.auth.signInWithPassword({ email, password })

        if (error) {
          mostrarError('El email o la contraseña no son correctos.')
          inputPassword.select()
          estadoCargando(false)
          return
        }

        // Además de la cuenta, tiene que figurar como administrador activo
        const { data: admin } = await db
          .from('administradores')
          .select('id')
          .eq('id', data.user.id)
          .eq('activo', true)
          .limit(1)

        if (!admin || admin.length === 0) {
          await db.auth.signOut()
          mostrarError('Esta cuenta no tiene permisos de administrador. Consultá con el responsable del gimnasio.')
          estadoCargando(false)
          return
        }

        window.location.href = DESTINO

      } catch (err) {
        mostrarError('No se pudo conectar con el servidor. Revisá la conexión a internet y volvé a intentar.')
        estadoCargando(false)
      }
    })

    // Si el logo no carga, avisamos en la consola para detectarlo rápido
    document.querySelectorAll('img[src="leon.webp"]').forEach(img => {
      img.addEventListener('error', () => {
        console.warn('No se encontró leon.webp: tiene que estar en la misma carpeta que login.html')
        img.style.visibility = 'hidden'
      })
    })
  </script>
</body>
</html>
