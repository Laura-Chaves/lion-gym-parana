<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#141213">
  <title>Recepción | Lion Gym Paraná</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ============================================================
       TOKENS DE DISEÑO — mismos valores que index.html y login.html
       ============================================================ */
    :root {
      --fondo: #141213;
      --superficie: #1b1819;
      --elevada: #241f21;
      --linea: #2f292b;
      --texto: #f3f0ef;
      --texto-2: #a39a9c;
      --texto-3: #736b6d;
      --rojo: #cc0000;
      --rojo-hover: #e00b0b;
      --rojo-texto: #ff5a52;

      --ok: #3ecf74;
      --ok-fondo: rgba(62, 207, 116, 0.1);
      --alerta: #f5b544;
      --alerta-fondo: rgba(245, 181, 68, 0.1);
      --deuda: #ff5a52;
      --deuda-fondo: rgba(204, 0, 0, 0.14);
      --neutro: #a39a9c;
      --neutro-fondo: rgba(255, 255, 255, 0.05);

      --f-titulo: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
      --f-texto: 'Barlow', 'Segoe UI', system-ui, sans-serif;

      --radio: 6px;
      --transicion: 160ms ease;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: var(--f-texto);
      font-size: 16px;
      line-height: 1.5;
      color: var(--texto);
      -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(ellipse 60% 50% at 50% 30%, rgba(204, 0, 0, 0.16) 0%, rgba(204, 0, 0, 0.04) 45%, transparent 75%),
        var(--fondo);
    }

    /* Textura de líneas diagonales, como un piso de goma */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(-60deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 14px);
      -webkit-mask-image: radial-gradient(ellipse 60% 55% at 50% 30%, #000 0%, transparent 75%);
              mask-image: radial-gradient(ellipse 60% 55% at 50% 30%, #000 0%, transparent 75%);
      pointer-events: none;
      z-index: -1;
    }

    button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }

    :focus-visible {
      outline: 2px solid var(--rojo-texto);
      outline-offset: 2px;
    }

    .icono {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .oculto { display: none !important; }

    /* ============================================================
       ESTRUCTURA: una sola columna centrada
       ============================================================ */
    .pagina {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1.25rem 0;
    }

    /* Reloj arriba a la derecha */
    .reloj {
      position: fixed;
      top: 1.25rem;
      right: 1.75rem;
      text-align: right;
    }

    .reloj-hora {
      font-family: var(--f-titulo);
      font-weight: 600;
      font-size: 2.6rem;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .reloj-fecha {
      font-size: 0.95rem;
      color: var(--texto-2);
      margin-top: 0.2rem;
    }

    /* ---------- Marca ---------- */
    .marca {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: auto;
    }

    .marca-leon {
      width: clamp(110px, 17vh, 170px);
      aspect-ratio: 1;
      object-fit: contain;
      filter: drop-shadow(0 0 30px rgba(204, 0, 0, 0.55));
      clip-path: inset(0 0 7% 0); /* recorta el texto que trae el logo abajo */
      transition: width 250ms ease;
    }

    .marca-nombre {
      font-family: var(--f-titulo);
      font-weight: 700;
      font-size: clamp(2.4rem, 6vh, 3.4rem);
      line-height: 0.9;
      letter-spacing: 0.05em;
      white-space: nowrap;
      color: var(--rojo);
      margin-top: 0.25rem;
    }

    .marca-lugar {
      font-family: var(--f-titulo);
      font-weight: 500;
      font-size: 1.1rem;
      letter-spacing: 0.3em;
      padding-left: 0.3em;
      color: var(--texto-2);
      margin-top: 0.35rem;
    }

    /* Con el resultado a la vista, la marca se achica para dar lugar */
    body.con-resultado .marca-leon { width: 72px; }
    body.con-resultado .marca-nombre { font-size: 1.9rem; }
    body.con-resultado .marca-lugar { display: none; }

    /* ---------- Zona central (formulario o resultado) ---------- */
    .zona {
      width: 100%;
      max-width: 560px;
      margin: 2rem 0 auto;
    }

    /* Formulario de DNI */
    .form-dni { text-align: center; }

    .form-dni label {
      display: block;
      font-family: var(--f-titulo);
      font-weight: 700;
      font-size: 2.2rem;
      line-height: 1;
      margin-bottom: 1.1rem;
    }

    .campo-dni {
      display: flex;
      gap: 0.6rem;
      max-width: 460px;
      margin: 0 auto;
    }

    .campo-dni input {
      flex: 1;
      min-width: 0;
      height: 68px;
      padding: 0 1rem;
      font-family: var(--f-titulo);
      font-weight: 600;
      font-size: 2.4rem;
      letter-spacing: 0.08em;
      text-align: center;
      font-variant-numeric: tabular-nums;
      color: var(--texto);
      background: var(--superficie);
      border: 1px solid var(--linea);
      border-radius: var(--radio);
      outline: none;
      transition: border-color var(--transicion), background var(--transicion);
    }

    .campo-dni input::placeholder {
      font-family: var(--f-texto);
      font-weight: 400;
      font-size: 1.1rem;
      letter-spacing: 0;
      color: var(--texto-3);
    }

    .campo-dni input:focus {
      border-color: var(--rojo);
      background: var(--elevada);
    }

    .campo-dni input.sacudir { animation: sacudir 320ms ease; }

    @keyframes sacudir {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    .btn-ingresar {
      height: 68px;
      padding: 0 1.75rem;
      border-radius: var(--radio);
      background: var(--rojo);
      color: #fff;
      font-family: var(--f-titulo);
      font-weight: 600;
      font-size: 1.5rem;
      transition: background var(--transicion);
    }

    .btn-ingresar:hover { background: var(--rojo-hover); }

    .btn-ingresar:disabled {
      background: var(--elevada);
      color: var(--texto-3);
      cursor: wait;
    }

    .ayuda {
      margin-top: 0.9rem;
      color: var(--texto-3);
      font-size: 0.95rem;
    }

    /* ---------- Pie ---------- */
    .pie {
      position: relative;
      width: 100vw;
      margin-top: 2rem;
      padding: 0 1.75rem 1.6rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lema {
      font-family: var(--f-titulo);
      font-weight: 500;
      font-size: 1.35rem;
      letter-spacing: 0.02em;
      color: var(--texto-2);
    }

    .pie::after {
      content: '';
      position: absolute;
      left: -5%;
      right: -5%;
      bottom: 0;
      height: 6px;
      background: var(--rojo);
      transform: skewY(-0.8deg);
      transform-origin: left;
    }

    .acceso-personal {
      position: absolute;
      right: 1.5rem;
      bottom: 1.3rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      color: var(--texto-3);
      text-decoration: none;
      padding: 0.4rem;
      transition: color var(--transicion);
    }

    .acceso-personal:hover { color: var(--texto-2); }

    /* ============================================================
       RESULTADO DEL SOCIO
       ============================================================ */
    .resultado { animation: entrar 260ms ease both; }

    @keyframes entrar {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .confirmacion {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
      color: var(--ok);
    }

    .confirmacion .icono { width: 22px; height: 22px; stroke-width: 2.25; }

    .hola {
      font-family: var(--f-titulo);
      font-weight: 700;
      font-size: clamp(2.6rem, 7vw, 3.8rem);
      line-height: 0.95;
      margin: 0.3rem 0 1rem;
      overflow-wrap: anywhere;
    }

    .estado {
      border-radius: var(--radio);
      border-left: 5px solid currentColor;
      padding: 1rem 1.35rem;
    }

    .estado.ok      { color: var(--ok);     background: var(--ok-fondo); }
    .estado.alerta  { color: var(--alerta); background: var(--alerta-fondo); }
    .estado.deuda   { color: var(--deuda);  background: var(--deuda-fondo); }
    .estado.neutro  { color: var(--neutro); background: var(--neutro-fondo); }

    .estado-etiqueta {
      font-family: var(--f-titulo);
      font-weight: 700;
      font-size: clamp(2rem, 5vw, 2.6rem);
      line-height: 1;
      letter-spacing: 0.02em;
    }

    .estado-detalle {
      color: var(--texto);
      font-size: 1.05rem;
      margin-top: 0.3rem;
    }

    .datos { margin-top: 0.75rem; }

    .dato {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      padding: 0.55rem 0;
      border-bottom: 1px solid var(--linea);
      font-size: 1.05rem;
    }

    .dato-nombre { color: var(--texto-2); }
    .dato-valor { font-weight: 600; text-align: right; }

    .dato.total { border-bottom: none; padding-top: 0.8rem; }
    .dato.total .dato-nombre { color: var(--texto); font-weight: 600; }

    .dato.total .dato-valor {
      font-family: var(--f-titulo);
      font-size: 1.9rem;
      line-height: 1;
      color: var(--deuda);
    }

    .nota {
      margin-top: 0.6rem;
      color: var(--texto-2);
    }

    .aviso-ingreso {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 1rem;
      padding: 0.7rem 1rem;
      border-radius: var(--radio);
      background: var(--neutro-fondo);
      color: var(--texto-2);
    }

    .aviso-ingreso .icono { width: 20px; height: 20px; }

    .mensaje-titulo {
      font-family: var(--f-titulo);
      font-weight: 700;
      font-size: clamp(2.2rem, 6vw, 3rem);
      line-height: 1;
      margin-bottom: 0.6rem;
      text-align: center;
    }

    .mensaje-texto {
      font-size: 1.1rem;
      color: var(--texto-2);
      text-align: center;
      max-width: 44ch;
      margin: 0 auto;
    }

    .btn-listo {
      position: relative;
      overflow: hidden;
      width: 100%;
      height: 56px;
      margin-top: 1.25rem;
      border-radius: var(--radio);
      background: var(--elevada);
      border: 1px solid var(--linea);
      font-family: var(--f-titulo);
      font-weight: 600;
      font-size: 1.4rem;
      transition: background var(--transicion);
    }

    .btn-listo:hover { background: #2c2628; }
    .btn-listo-texto { position: relative; z-index: 1; }

    .cuenta {
      position: absolute;
      left: 0;
      bottom: 0;
      height: 3px;
      width: 100%;
      background: var(--rojo);
      transform-origin: left;
    }

    .cuenta.corriendo { animation: descontar linear forwards; }

    @keyframes descontar {
      from { transform: scaleX(1); }
      to   { transform: scaleX(0); }
    }

    .siguiente {
      margin-top: 0.7rem;
      text-align: center;
      font-size: 0.9rem;
      color: var(--texto-3);
    }

    /* En pantallas anchas el resultado se reparte en dos columnas
       para que entre completo sin hacer scroll */
    @media (min-width: 900px) {
      body.con-resultado .zona { max-width: 940px; }
      .res-grid {
        display: grid;
        grid-template-columns: 1.1fr 1fr;
        gap: 2.75rem;
        align-items: end;
      }
      .res-der .datos { margin-top: 0; }
    }

    /* ============================================================
       PANTALLAS CHICAS
       ============================================================ */
    @media (max-width: 700px) {
      .reloj {
        position: static;
        align-self: stretch;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        text-align: left;
        margin-bottom: 1rem;
      }
      .reloj-hora { font-size: 1.8rem; }
      .reloj-fecha { margin: 0; }
      .marca { margin-top: 0; }
      .campo-dni { flex-direction: column; }
      .form-dni label { font-size: 1.9rem; }
      .lema { font-size: 1.15rem; }
      .acceso-personal { position: static; margin-left: auto; }
      .pie { justify-content: space-between; gap: 1rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>

  <div class="pagina">

    <div class="reloj" aria-hidden="true">
      <div class="reloj-hora" id="relojHora">--:--</div>
      <div class="reloj-fecha" id="relojFecha"></div>
    </div>

    <header class="marca">
      <img class="marca-leon" src="leon.webp" alt="Logo de Lion Gym">
      <div class="marca-nombre">LION GYM</div>
      <div class="marca-lugar">PARANÁ</div>
    </header>

    <main class="zona">

      <!-- Formulario de DNI -->
      <form class="form-dni" id="formDni" autocomplete="off">
        <label for="inputDni">Ingresá tu DNI</label>
        <div class="campo-dni">
          <input type="text" id="inputDni" inputmode="numeric" maxlength="9"
                 placeholder="Sin puntos ni espacios" autofocus>
          <button type="submit" class="btn-ingresar" id="btnIngresar">Ingresar</button>
        </div>
        <p class="ayuda">Escribí tu número y apretá Enter</p>
      </form>

      <!-- Resultado (se completa por JS) -->
      <div class="resultado oculto" id="resultado" aria-live="polite"></div>

    </main>

    <footer class="pie">
      <p class="lema">La mente es el límite.</p>
      <a class="acceso-personal" href="login.html">
        <svg class="icono" width="15" height="15" viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="10" rx="1.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
        Personal
      </a>
    </footer>

  </div>

  <script>
    const SUPABASE_URL = 'https://hlhsrbstxxdanyckujem.supabase.co'
    const SUPABASE_KEY = 'sb_publishable_NOA6FfVrGTtkX0eu_rvyZA_Uyye2XRl'
    const { createClient } = supabase
    const db = createClient(SUPABASE_URL, SUPABASE_KEY)

    // Segundos que queda visible la información del socio
    const SEGUNDOS_RESULTADO = 12
    // Segundos para mensajes sin socio (DNI no encontrado, error)
    const SEGUNDOS_MENSAJE = 6

    /* ============================================================
       REGLA DE ESTADO DE CUOTA
       Misma lógica que el sistema actual. Queda aislada en esta
       función para moverla después a js/estado-cuota.js y usarla
       desde todas las pantallas.

       - Vencimiento personal = fecha del último pago + 1 mes
       - hoy <= vencimiento → al día
       - hoy >  vencimiento → vencida
       - Sin pagos → pendiente
       - Recargo (solo si debe): hoy es posterior al día de corte del plan
       ============================================================ */
    function calcularEstadoCuota({ fechaUltimoPago, plan, ahora = new Date() }) {
      const diaCorte = plan.dia_vencimiento || 10
      const porcentajeRecargo = plan.porcentaje_recargo || 15
      const precio = Number(plan.precio)
      const conRecargo = ahora.getDate() > diaCorte
      const montoConRecargo = precio * (1 + porcentajeRecargo / 100)

      if (!fechaUltimoPago) {
        return {
          estado: 'pendiente',
          diaCorte, porcentajeRecargo, precio, conRecargo,
          monto: conRecargo ? montoConRecargo : precio
        }
      }

      // Nota: setMonth desborda a fin de mes (31/01 + 1 mes = 03/03).
      // Se mantiene igual que el sistema actual hasta definir ese caso.
      const vencimiento = new Date(fechaUltimoPago)
      vencimiento.setMonth(vencimiento.getMonth() + 1)

      const hoy0 = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate())
      const venc0 = new Date(vencimiento.getFullYear(), vencimiento.getMonth(), vencimiento.getDate())
      const diff = Math.round((venc0 - hoy0) / 86400000)

      if (diff >= 0) {
        return { estado: 'al-dia', vencimiento, diasRestantes: diff, diaCorte, porcentajeRecargo, precio }
      }

      return {
        estado: 'vencida',
        vencimiento,
        diasVencido: Math.abs(diff),
        diaCorte, porcentajeRecargo, precio, conRecargo,
        monto: conRecargo ? montoConRecargo : precio
      }
    }

    /* ============================================================
       UTILIDADES
       ============================================================ */
    const pesos = n => Number(n).toLocaleString('es-AR', { style: 'currency', currency: 'ARS' })
    const fechaLarga = f => f.toLocaleDateString('es-AR', { day: 'numeric', month: 'long' })
    const horaCorta = f => f.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false })
    const primerNombre = nombre => (nombre || '').trim().split(/\s+/)[0]

    // Evita que un nombre con caracteres raros rompa el HTML
    const escapar = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))

    const ICONO_CHECK = '<svg class="icono" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>'
    const ICONO_RELOJ = '<svg class="icono" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>'

    /* ============================================================
       RELOJ
       ============================================================ */
    function actualizarReloj() {
      const ahora = new Date()
      document.getElementById('relojHora').textContent = horaCorta(ahora)
      const fecha = ahora.toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' })
      document.getElementById('relojFecha').textContent = fecha.charAt(0).toUpperCase() + fecha.slice(1)
    }
    actualizarReloj()
    setInterval(actualizarReloj, 1000 * 15)

    /* ============================================================
       FORMULARIO
       ============================================================ */
    const form = document.getElementById('formDni')
    const inputDni = document.getElementById('inputDni')
    const btnIngresar = document.getElementById('btnIngresar')
    const resultado = document.getElementById('resultado')
    let buscando = false

    // Solo números (si alguien escribe puntos o espacios, se limpian solos)
    inputDni.addEventListener('input', () => {
      inputDni.value = inputDni.value.replace(/\D/g, '').slice(0, 9)
    })

    // El cursor siempre vuelve al campo de DNI
    function enfocar() {
      if (!resultado.classList.contains('oculto')) return
      inputDni.focus()
    }
    window.addEventListener('focus', enfocar)
    document.addEventListener('click', e => {
      if (!e.target.closest('a, button, input')) enfocar()
    })

    form.addEventListener('submit', e => {
      e.preventDefault()
      const dni = inputDni.value.trim()
      if (!dni) {
        inputDni.classList.remove('sacudir')
        void inputDni.offsetWidth
        inputDni.classList.add('sacudir')
        return
      }
      registrarIngreso(dni)
    })

    // Mientras se ve el resultado: Enter/Escape cierra, y si el
    // siguiente socio empieza a escribir su DNI, se vuelve directo.
    document.addEventListener('keydown', e => {
      if (resultado.classList.contains('oculto')) return
      if (e.key === 'Enter' || e.key === 'Escape') {
        e.preventDefault()
        volverAlInicio()
      } else if (/^[0-9]$/.test(e.key)) {
        e.preventDefault()
        volverAlInicio(e.key)
      }
    })

    function estadoBuscando(activo) {
      buscando = activo
      btnIngresar.disabled = activo
      inputDni.readOnly = activo
      btnIngresar.textContent = activo ? 'Buscando…' : 'Ingresar'
    }

    /* ============================================================
       REGISTRO DE INGRESO — mismas consultas que el sistema actual
       ============================================================ */
    async function registrarIngreso(dni) {
      if (buscando) return
      estadoBuscando(true)

      try {
        const { data: socios, error } = await db
          .from('socios')
          .select('*')
          .eq('dni', dni)
          .limit(1)

        if (error) throw error

        if (!socios || socios.length === 0) {
          mostrarMensaje(
            'No encontramos ese DNI',
            `Revisá el número (${escapar(dni)}). Si todavía no sos socio, consultá en el mostrador.`
          )
          return
        }

        const socio = socios[0]
        const ahora = new Date()

        const { data: membresias } = await db
          .from('membresias')
          .select('*, planes(*)')
          .eq('socio_id', socio.id)
          .eq('estado', 'activa')
          .limit(1)

        const membresia = membresias && membresias.length > 0 ? membresias[0] : null

        let cuota = null
        if (membresia) {
          const { data: ultimosPagos } = await db
            .from('pagos')
            .select('fecha_pago')
            .eq('socio_id', socio.id)
            .order('fecha_pago', { ascending: false })
            .limit(1)

          const fechaUltimoPago = ultimosPagos && ultimosPagos.length > 0 ? ultimosPagos[0].fecha_pago : null
          cuota = calcularEstadoCuota({ fechaUltimoPago, plan: membresia.planes, ahora })
        }

        // Ingresos anteriores de hoy (para el aviso). El nuevo se registra igual.
        const hoyInicio = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate()).toISOString()
        const { data: ingresosHoy } = await db
          .from('asistencia')
          .select('fecha_hora')
          .eq('socio_id', socio.id)
          .gte('fecha_hora', hoyInicio)
          .order('fecha_hora', { ascending: false })

        const ultimoIngresoHoy = ingresosHoy && ingresosHoy.length > 0 ? new Date(ingresosHoy[0].fecha_hora) : null

        const { error: errorIngreso } = await db.from('asistencia').insert({ socio_id: socio.id })

        if (errorIngreso) {
          mostrarMensaje('No pudimos registrar tu ingreso', 'Avisá en el mostrador para que lo registren a mano.')
          return
        }

        mostrarSocio({ socio, membresia, cuota, ahora, ultimoIngresoHoy })

      } catch (err) {
        console.error(err)
        mostrarMensaje(
          'Sin conexión',
          'No pudimos conectarnos con el sistema. Esperá unos segundos y volvé a intentar, o avisá en el mostrador.'
        )
      }
    }

    /* ============================================================
       PANTALLA DEL SOCIO
       ============================================================ */
    function bloqueEstado(membresia, cuota) {
      if (!membresia) {
        return {
          clase: 'neutro',
          etiqueta: 'SIN PLAN ACTIVO',
          detalle: 'No tenés una membresía activa. Consultá en el mostrador.'
        }
      }

      if (cuota.estado === 'al-dia') {
        const d = cuota.diasRestantes
        const detalle = d === 0 ? 'Tu cuota vence hoy'
          : d === 1 ? `Falta 1 día para el vencimiento`
          : `Faltan ${d} días para el vencimiento`
        return { clase: d <= 3 ? 'alerta' : 'ok', etiqueta: 'AL DÍA', detalle }
      }

      if (cuota.estado === 'vencida') {
        const d = cuota.diasVencido
        return {
          clase: 'deuda',
          etiqueta: 'VENCIDA',
          detalle: d === 1 ? 'Tu cuota venció ayer' : `Tu cuota venció hace ${d} días`
        }
      }

      return {
        clase: 'alerta',
        etiqueta: 'PENDIENTE',
        detalle: 'Todavía no hay pagos registrados'
      }
    }

    function filasDatos(membresia, cuota) {
      if (!membresia) return ''

      let html = `
        <div class="dato">
          <span class="dato-nombre">Plan</span>
          <span class="dato-valor">${escapar(membresia.planes.nombre)}</span>
        </div>`

      if (cuota.vencimiento) {
        html += `
        <div class="dato">
          <span class="dato-nombre">${cuota.estado === 'vencida' ? 'Venció el' : 'Vence el'}</span>
          <span class="dato-valor">${fechaLarga(cuota.vencimiento)}</span>
        </div>`
      }

      if (cuota.estado === 'vencida' || cuota.estado === 'pendiente') {
        html += `
        <div class="dato">
          <span class="dato-nombre">Cuota</span>
          <span class="dato-valor">${pesos(cuota.precio)}</span>
        </div>`

        if (cuota.conRecargo) {
          html += `
        <div class="dato">
          <span class="dato-nombre">Recargo ${cuota.porcentajeRecargo}%</span>
          <span class="dato-valor">${pesos(cuota.monto - cuota.precio)}</span>
        </div>`
        }

        html += `
        <div class="dato total">
          <span class="dato-nombre">Total a pagar</span>
          <span class="dato-valor">${pesos(cuota.monto)}</span>
        </div>`
      }

      return html
    }

    function notaCuota(membresia, cuota) {
      if (!membresia) return ''
      if ((cuota.estado === 'vencida' || cuota.estado === 'pendiente') && !cuota.conRecargo) {
        return `<p class="nota">Pagando hasta el día ${cuota.diaCorte} de este mes no tenés recargo.</p>`
      }
      return ''
    }

    function mostrarSocio({ socio, membresia, cuota, ahora, ultimoIngresoHoy }) {
      const estado = bloqueEstado(membresia, cuota)

      const aviso = ultimoIngresoHoy
        ? `<div class="aviso-ingreso">${ICONO_RELOJ}Ya registraste un ingreso hoy a las ${horaCorta(ultimoIngresoHoy)}</div>`
        : ''

      resultado.innerHTML = `
        <div class="res-grid">
          <div class="res-izq">
            <div class="confirmacion">${ICONO_CHECK}Ingreso registrado a las ${horaCorta(ahora)}</div>
            <h1 class="hola">Hola, ${escapar(primerNombre(socio.nombre))}</h1>
            <div class="estado ${estado.clase}">
              <div class="estado-etiqueta">${estado.etiqueta}</div>
              <div class="estado-detalle">${estado.detalle}</div>
            </div>
            ${aviso}
          </div>
          <div class="res-der">
            <div class="datos">${filasDatos(membresia, cuota)}</div>
            ${notaCuota(membresia, cuota)}
            ${botonListo()}
          </div>
        </div>
      `
      abrirResultado(SEGUNDOS_RESULTADO)
    }

    function mostrarMensaje(titulo, texto) {
      resultado.innerHTML = `
        <h1 class="mensaje-titulo">${titulo}</h1>
        <p class="mensaje-texto">${texto}</p>
        ${botonListo('Volver')}
      `
      abrirResultado(SEGUNDOS_MENSAJE)
    }

    function botonListo(texto = 'Listo') {
      return `
        <button class="btn-listo" type="button" id="btnListo">
          <span class="btn-listo-texto">${texto}</span>
          <span class="cuenta" id="cuenta"></span>
        </button>
        <p class="siguiente">El siguiente socio puede escribir su DNI directamente</p>`
    }

    /* ============================================================
       MOSTRAR / OCULTAR RESULTADO
       ============================================================ */
    let temporizador = null

    function abrirResultado(segundos) {
      form.classList.add('oculto')
      resultado.classList.remove('oculto')
      document.body.classList.add('con-resultado')
      inputDni.blur()

      const cuenta = document.getElementById('cuenta')
      cuenta.style.animationDuration = `${segundos}s`
      cuenta.classList.add('corriendo')
      document.getElementById('btnListo').addEventListener('click', () => volverAlInicio())

      clearTimeout(temporizador)
      temporizador = setTimeout(() => volverAlInicio(), segundos * 1000)
    }

    function volverAlInicio(primerDigito = '') {
      clearTimeout(temporizador)
      resultado.classList.add('oculto')
      resultado.innerHTML = '' // no dejar datos del socio en la página
      document.body.classList.remove('con-resultado')
      form.classList.remove('oculto')

      estadoBuscando(false)
      inputDni.value = primerDigito
      inputDni.focus()
    }
  </script>
</body>
</html>
