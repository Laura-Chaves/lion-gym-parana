<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#141213">
  <title>Socios | Lion Gym Paraná</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ============================================================
       TOKENS DE DISEÑO — se van a mover a css/tokens.css cuando
       rediseñemos el resto de las páginas.
       ============================================================ */
    :root {
      --fondo: #141213;
      --superficie: #1b1819;
      --elevada: #241f21;
      --linea: #2f292b;
      --linea-suave: #231e20;
      --texto: #f3f0ef;
      --texto-2: #a39a9c;
      --texto-3: #736b6d;
      --rojo: #cc0000;
      --rojo-hover: #e00b0b;
      --rojo-texto: #ff5a52;

      --f-titulo: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
      --f-texto: 'Barlow', 'Segoe UI', system-ui, sans-serif;

      --ancho-lateral: 248px;
      --radio: 6px;
      --transicion: 160ms ease;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: var(--f-texto);
      font-size: 16px;
      line-height: 1.5;
      background: var(--fondo);
      color: var(--texto);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
    svg { flex-shrink: 0; }

    :focus-visible {
      outline: 2px solid var(--rojo-texto);
      outline-offset: 2px;
      border-radius: 2px;
    }

    /* Mientras se verifica la sesión no mostramos nada */
    body.verificando .app { visibility: hidden; }

    .icono {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ============================================================
       ESTRUCTURA
       ============================================================ */
    .app {
      display: grid;
      grid-template-columns: var(--ancho-lateral) 1fr;
      min-height: 100vh;
    }

    /* ---------- Barra lateral ---------- */
    .lateral {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--superficie);
      border-right: 1px solid var(--linea);
      padding: 1.5rem 0 1.25rem;
      overflow-y: auto;
    }

    .marca {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0 1.25rem 1.5rem;
    }

    .marca img {
      width: 44px;
      height: 44px;
      object-fit: contain;
    }

    .marca-nombre {
      font-family: var(--f-titulo);
      font-weight: 700;
      font-size: 1.45rem;
      letter-spacing: 0.06em;
      line-height: 1;
      color: var(--rojo);
    }

    .marca-lugar {
      font-size: 0.8rem;
      color: var(--texto-2);
      margin-top: 0.2rem;
    }

    .nav { flex: 1; }

    .nav-grupo { padding: 0.9rem 0 0.4rem; }

    .nav-grupo-titulo {
      font-family: var(--f-titulo);
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
      color: var(--texto-3);
      padding: 0 1.25rem 0.35rem;
    }

    .nav-link {
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.55rem 1.25rem;
      font-size: 0.95rem;
      color: var(--texto-2);
      transition: color var(--transicion), background var(--transicion);
    }

    .nav-link:hover { color: var(--texto); background: var(--elevada); }

    .nav-link[aria-current="page"] {
      color: var(--texto);
      background: var(--elevada);
    }

    .nav-link[aria-current="page"]::before {
      content: '';
      position: absolute;
      left: 0;
      top: 6px;
      bottom: 6px;
      width: 3px;
      background: var(--rojo);
    }

    .lateral-pie {
      border-top: 1px solid var(--linea);
      padding: 1rem 1.25rem 0;
      margin-top: 1rem;
    }

    .admin-nombre {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .admin-rol {
      font-size: 0.8rem;
      color: var(--texto-3);
      margin-bottom: 0.75rem;
    }

    .btn-salir {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.9rem;
      color: var(--texto-2);
      padding: 0.35rem 0;
      transition: color var(--transicion);
    }

    .btn-salir:hover { color: var(--rojo-texto); }

    /* ---------- Barra superior e inferior (solo celular) ---------- */
    .barra-movil,
    .nav-inferior,
    .velo { display: none; }

    /* ============================================================
       PÁGINA INTERNA
       ============================================================ */
    .principal {
      min-width: 0;
      padding: 0 clamp(1.25rem, 3.5vw, 3rem) 7rem;
    }

    .contenido { max-width: 1240px; }

    /* Evita que el contenido ancho empuje la página hacia los costados */
    .principal-wrap,
    .espacio > * { min-width: 0; }

    .oculto { display: none !important; }

    /* ---------- Encabezado de página (león gris) ---------- */
    .encabezado {
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1.5rem;
      padding: clamp(2rem, 5vh, 3.25rem) 0 2rem;
      overflow: hidden;
    }

    .encabezado-leon {
      position: absolute;
      right: 180px;
      top: 50%;
      width: 300px;
      transform: translateY(-50%);
      opacity: 0.07;
      filter: grayscale(1) brightness(1.6);
      clip-path: inset(0 0 7% 0);
      pointer-events: none;
      user-select: none;
    }

    .encabezado-texto { position: relative; }

    .antetitulo {
      font-size: 0.95rem;
      color: var(--texto-2);
      margin-bottom: 0.25rem;
    }

    .titulo-pagina {
      font-family: var(--f-titulo);
      font-weight: 700;
      font-size: clamp(2.6rem, 5vw, 3.6rem);
      line-height: 0.95;
    }

    .bajada {
      color: var(--texto-2);
      margin-top: 0.6rem;
      max-width: 46ch;
    }

    .trazo {
      display: block;
      width: 72px;
      height: 6px;
      margin-top: 1.1rem;
      background: var(--rojo);
      transform: skewX(-24deg);
    }

    /* ---------- Botones ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      height: 44px;
      padding: 0 1.1rem;
      border-radius: var(--radio);
      border: 1px solid var(--linea);
      background: var(--superficie);
      font-weight: 600;
      font-size: 0.95rem;
      white-space: nowrap;
      transition: background var(--transicion), border-color var(--transicion), color var(--transicion);
    }

    .btn:hover { background: var(--elevada); border-color: #4a3f42; }
    .btn .icono { width: 18px; height: 18px; }

    .btn-primario {
      background: var(--rojo);
      border-color: var(--rojo);
      color: #fff;
    }

    .btn-primario:hover { background: var(--rojo-hover); border-color: var(--rojo-hover); }

    .btn-primario:disabled {
      background: var(--elevada);
      border-color: var(--linea);
      color: var(--texto-3);
      cursor: wait;
    }

    .btn-fantasma {
      background: none;
      border-color: transparent;
      color: var(--texto-2);
    }

    .btn-fantasma:hover { background: var(--elevada); color: var(--texto); border-color: transparent; }

    .btn-icono {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: var(--radio);
      color: var(--texto-3);
      transition: color var(--transicion), background var(--transicion);
    }

    .btn-icono:hover { color: var(--texto); background: var(--elevada); }
    .btn-icono.peligro:hover { color: var(--rojo-texto); background: rgba(204, 0, 0, 0.12); }
    .btn-icono .icono { width: 17px; height: 17px; }
    .btn-icono:disabled { opacity: 0.3; pointer-events: none; }


    /* ---------- Mensajes ---------- */
    .mensaje { display: none; margin-top: 0.9rem; padding: 0.75rem 1rem; border-radius: var(--radio); font-size: 0.95rem; }
    .mensaje.visible { display: block; }
    .mensaje.error  { color: #ffb3ad; background: rgba(204, 0, 0, 0.14); border: 1px solid rgba(255, 90, 82, 0.35); }
    .mensaje.exito  { color: #9ff0bd; background: rgba(62, 207, 116, 0.1); border: 1px solid rgba(62, 207, 116, 0.35); }
    .mensaje.aviso  { color: #f5d08a; background: rgba(245, 181, 68, 0.1); border: 1px solid rgba(245, 181, 68, 0.35); }

    /* ---------- Estado de cuota (mismos colores que Registrar pago) ---------- */
    .estado-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 0.15rem 0.5rem;
      border-radius: 3px;
      white-space: nowrap;
    }

    .estado-tag::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .estado-tag.al_dia        { color: #6fe39a; background: rgba(62, 207, 116, 0.12); }
    .estado-tag.por_vencer    { color: #f5c46b; background: rgba(245, 181, 68, 0.13); }
    .estado-tag.vencida       { color: #ff8a83; background: rgba(204, 0, 0, 0.16); }
    .estado-tag.pendiente     { color: #f5c46b; background: rgba(245, 181, 68, 0.13); }
    .estado-tag.sin_membresia { color: var(--texto-2); background: rgba(255, 255, 255, 0.06); }
    .estado-tag.baja          { color: var(--texto-3); background: rgba(255, 255, 255, 0.04); }

    /* ---------- Formularios ---------- */
    .campo { display: flex; flex-direction: column; gap: 0.35rem; min-width: 0; }
    .campo label { font-size: 0.85rem; font-weight: 600; color: var(--texto-2); }
    .campo label .obligatorio { color: var(--rojo-texto); }
    .campo .ayuda { font-size: 0.8rem; color: var(--texto-3); }

    .campo input, .campo select, .campo textarea {
      width: 100%;
      height: 46px;
      padding: 0 0.9rem;
      font: inherit;
      color: var(--texto);
      background: var(--fondo);
      border: 1px solid var(--linea);
      border-radius: var(--radio);
      outline: none;
      color-scheme: dark;
      transition: border-color var(--transicion);
    }

    .campo textarea { height: auto; min-height: 84px; padding: 0.7rem 0.9rem; resize: vertical; }
    .campo input:focus, .campo select:focus, .campo textarea:focus { border-color: var(--rojo); }
    .campo input.invalido { border-color: var(--rojo-texto); }

    .tarjeta {
      border-radius: 12px;
      border: 1px solid var(--linea);
      background: var(--superficie);
    }

    .tarjeta-cab {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.1rem 1.4rem;
      border-bottom: 1px solid var(--linea);
    }

    .tarjeta-titulo { font-family: var(--f-titulo); font-weight: 600; font-size: 1.4rem; line-height: 1.1; }
    .tarjeta-sub { font-size: 0.85rem; color: var(--texto-3); margin-top: 0.1rem; }
    .tarjeta-cuerpo { padding: 1.25rem 1.4rem 1.4rem; }

    .avatar-ini {
      flex: none;
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-family: var(--f-titulo);
      font-weight: 700;
      font-size: 1rem;
      color: var(--texto);
      background: linear-gradient(145deg, #3a2f32, #241f21);
      border: 1px solid var(--linea);
    }

    .vacio-tabla { padding: 2.5rem 1.25rem; text-align: center; color: var(--texto-3); }
    .vacio-tabla strong { display: block; color: var(--texto); font-size: 1.05rem; margin-bottom: 0.25rem; }

    /* ============================================================
       LISTADO DE SOCIOS
       ============================================================ */
    .contadores {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0.6rem;
      margin-bottom: 1.25rem;
    }

    .contador {
      position: relative;
      text-align: left;
      padding: 0.9rem 1rem 0.85rem;
      border-radius: 10px;
      border: 1px solid var(--linea);
      background: var(--superficie);
      cursor: pointer;
      transition: border-color var(--transicion), background var(--transicion);
      min-width: 0;
    }

    .contador:hover { border-color: #4a3f42; background: var(--elevada); }

    .contador.activo {
      border-color: var(--c, var(--rojo));
      background: color-mix(in srgb, var(--c, var(--rojo)) 9%, var(--superficie));
    }

    .contador-nombre {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      color: var(--texto-2);
      white-space: nowrap;
    }

    .contador-nombre::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--c, var(--texto-3));
    }

    .contador-valor {
      font-family: var(--f-titulo);
      font-weight: 700;
      font-size: 2.1rem;
      line-height: 1.05;
      font-variant-numeric: tabular-nums;
    }

    .contador-extra { font-size: 0.75rem; color: var(--texto-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .contador[data-filtro="todos"]      { --c: #a39a9c; }
    .contador[data-filtro="al_dia"]     { --c: #3ecf74; }
    .contador[data-filtro="por_vencer"] { --c: #f5b544; }
    .contador[data-filtro="vencida"]    { --c: #ff5a52; }
    .contador[data-filtro="pendiente"]  { --c: #f5b544; }
    .contador[data-filtro="sin_membresia"] { --c: #736b6d; }

    /* Barra de herramientas */
    .herramientas {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
      padding: 0.9rem 1.1rem;
      border-bottom: 1px solid var(--linea);
    }

    .buscar {
      flex: 1;
      min-width: 220px;
      display: flex;
      align-items: center;
      gap: 0.55rem;
      height: 42px;
      padding: 0 0.85rem;
      border-radius: var(--radio);
      border: 1px solid var(--linea);
      background: var(--fondo);
      color: var(--texto-3);
    }

    .buscar:focus-within { border-color: var(--rojo); }
    .buscar .icono { width: 18px; height: 18px; }
    .buscar input { flex: 1; min-width: 0; height: 100%; border: none; outline: none; background: none; font: inherit; color: var(--texto); }

    .orden {
      height: 42px;
      padding: 0 0.75rem;
      font: inherit;
      font-size: 0.92rem;
      color: var(--texto);
      background: var(--fondo);
      border: 1px solid var(--linea);
      border-radius: var(--radio);
      color-scheme: dark;
    }

    .interruptor-baja {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.88rem;
      color: var(--texto-2);
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
    }

    .interruptor-baja input { accent-color: var(--rojo); width: 16px; height: 16px; }

    .conteo {
      padding: 0.6rem 1.1rem;
      font-size: 0.82rem;
      color: var(--texto-3);
      border-bottom: 1px solid var(--linea-suave);
    }

    /* Tabla */
    .tabla-scroll { overflow-x: auto; }
    .tabla-socios { width: 100%; border-collapse: collapse; }

    .tabla-socios th {
      text-align: left;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--texto-3);
      padding: 0.7rem 1rem;
      border-bottom: 1px solid var(--linea);
      white-space: nowrap;
      background: var(--superficie);
      position: sticky;
      top: 0;
      z-index: 1;
    }

    .tabla-socios td {
      padding: 0.7rem 0.85rem;
      border-bottom: 1px solid var(--linea-suave);
      vertical-align: middle;
    }

    .tabla-socios tbody tr:last-child td { border-bottom: none; }
    .tabla-socios tbody tr { transition: background var(--transicion); }
    .tabla-socios tbody tr:hover { background: rgba(255, 255, 255, 0.025); }
    .tabla-socios tr.de-baja { opacity: 0.55; }
    .tabla-socios .num { text-align: right; font-variant-numeric: tabular-nums; }

    .socio { display: flex; align-items: center; gap: 0.75rem; min-width: 0; }
    .socio-texto { min-width: 0; }
    .socio-nombre { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .socio-datos { font-size: 0.82rem; color: var(--texto-3); }

    .plan-nombre { font-size: 0.92rem; white-space: nowrap; }
    .plan-precio { font-size: 0.8rem; color: var(--texto-3); }

    .estado-detalle { font-size: 0.82rem; color: var(--texto-2); margin-top: 0.2rem; max-width: 300px; }
    .estado-detalle .recargo { color: #ff8a83; font-weight: 600; white-space: nowrap; }
    .socio-datos span { white-space: nowrap; }

    .monto { font-family: var(--f-titulo); font-weight: 700; font-size: 1.25rem; white-space: nowrap; }
    .monto.debe { color: #ff8a83; }
    .monto-vacio { color: var(--texto-3); }

    .acciones-fila { display: flex; justify-content: flex-end; gap: 0.25rem; }

    .accion-fila {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: var(--radio);
      color: var(--texto-3);
      border: 1px solid transparent;
      transition: color var(--transicion), background var(--transicion), border-color var(--transicion);
    }

    .accion-fila .icono { width: 18px; height: 18px; }
    .accion-fila:hover { color: var(--texto); background: var(--elevada); border-color: var(--linea); }
    .accion-fila.cobrar { color: #ff8a83; }
    .accion-fila.cobrar:hover { color: #fff; background: var(--rojo); border-color: var(--rojo); }
    .accion-fila.whatsapp:hover { color: #6fe39a; }
    .accion-fila.deshabilitada { opacity: 0.25; pointer-events: none; }

    @media (max-width: 1180px) {
      .contadores { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 820px) {
      .contadores { grid-template-columns: 1fr 1fr; gap: 0.5rem; }
      .contador-valor { font-size: 1.8rem; }
      .herramientas { padding: 0.75rem; }
      .buscar { min-width: 100%; }
      .orden { flex: 1; }

      /* La tabla pasa a tarjetas */
      .tabla-socios thead { display: none; }
      .tabla-socios, .tabla-socios tbody, .tabla-socios tr, .tabla-socios td { display: block; width: 100%; }
      .tabla-socios tr {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.35rem 0.75rem;
        padding: 0.85rem 0.85rem;
        border-bottom: 1px solid var(--linea-suave);
      }
      .tabla-socios td { padding: 0; border: none; }
      .tabla-socios td.col-socio { grid-column: 1 / -1; }
      .tabla-socios td.col-plan { display: none; }
      .tabla-socios td.col-estado { grid-column: 1; }
      .tabla-socios td.col-monto { grid-column: 2; text-align: right; align-self: center; }
      .tabla-socios td.col-acciones { grid-column: 1 / -1; }
      .acciones-fila { justify-content: flex-start; padding-left: calc(40px + 0.75rem); }
      .estado-detalle { white-space: normal; }
    }

    /* ============================================================
       CELULAR
       ============================================================ */
    @media (max-width: 820px) {
      .app { grid-template-columns: 1fr; }

      .lateral {
        position: fixed;
        z-index: 40;
        left: 0;
        top: 0;
        width: min(84vw, 300px);
        transform: translateX(-100%);
        transition: transform 220ms ease;
        padding-top: calc(1.5rem + env(safe-area-inset-top));
      }

      body.menu-abierto .lateral { transform: translateX(0); }

      .velo {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 30;
        background: rgba(0,0,0,0.6);
        opacity: 0;
        pointer-events: none;
        transition: opacity 220ms ease;
      }

      body.menu-abierto .velo { opacity: 1; pointer-events: auto; }

      .barra-movil {
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 20;
        padding: calc(0.75rem + env(safe-area-inset-top)) 1.25rem 0.75rem;
        background: rgba(20,18,19,0.94);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--linea);
      }

      .barra-movil .marca { padding: 0; gap: 0.6rem; }
      .barra-movil .marca img { width: 34px; height: 34px; }
      .barra-movil .marca-nombre { font-size: 1.25rem; }

      .principal { padding-bottom: calc(5rem + env(safe-area-inset-bottom)); }

      .encabezado { flex-direction: column; align-items: flex-start; padding: 1.75rem 0 1.5rem; }

    /* ============================================================

       ============================================================ */
    const escapar = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
    // Redondea a centavos antes de decidir si muestra decimales (48000 × 1,15 da 55199,999…)
    const pesos = n => { const v = Math.round(Number(n || 0) * 100) / 100; return v.toLocaleString('es-AR', { style: 'currency', currency: 'ARS', minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2 }) }
    const nombreBonito = t => String(t || '').trim().toLowerCase().replace(/(^|[\s'-])\S/g, c => c.toUpperCase())
    const fechaCorta = iso => iso ? new Date(String(iso).slice(0, 10) + 'T00:00:00').toLocaleDateString('es-AR') : ''
    const fechaLarga = iso => iso ? new Date(String(iso).slice(0, 10) + 'T00:00:00').toLocaleDateString('es-AR', { day: 'numeric', month: 'long' }) : ''

    // Fecha de hoy en la hora de la PC (no en UTC: después de las 21 sería mañana)
    function hoyLocal() {
      const d = new Date()
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`
    }

    function iniciales(nombre) {
      const p = (nombre || '').trim().split(/\s+/)
      return ((p[0]?.[0] || '') + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase()
    }

    function formatearTelefonoWhatsapp(telefono) {
      let digits = String(telefono || '').replace(/\D/g, '')
      if (!digits) return null
      if (digits.startsWith('54')) digits = digits.slice(2)
      if (digits.startsWith('9')) digits = digits.slice(1)
      if (digits.startsWith('0')) digits = digits.slice(1)
      digits = digits.replace(/^(\d{2,4})15/, '$1')
      return digits.length >= 8 ? `549${digits}` : null
    }

    function mostrarMensaje(id, texto, tipo) {
      const el = document.getElementById(id)
      el.className = `mensaje ${tipo} visible`
      el.textContent = texto
    }

    function ocultarMensaje(id) {
      document.getElementById(id).className = 'mensaje'
    }

    /* ============================================================
       ACCESO
       ============================================================ */
    async function verificarAcceso() {
      const { data } = await db.auth.getSession()
      if (!data.session) {
        window.location.href = 'login.html'
        return
      }
      const { data: admin } = await db
        .from('administradores')
        .select('nombre')
        .eq('id', data.session.user.id)
        .eq('activo', true)
        .limit(1)

      if (!admin || admin.length === 0) {
        await db.auth.signOut()
        window.location.href = 'login.html'
        return
      }

      document.getElementById('adminNombre').textContent = admin[0].nombre || 'Administrador'
      document.body.classList.remove('verificando')
      iniciarPagina()
    }

    async function cerrarSesion() {
      await db.auth.signOut()
      window.location.href = 'login.html'
    }

    /* ============================================================
       LISTADO DE SOCIOS
       Datos: vista v_socios_estado (migración 003), la misma regla de
       cuota que usan Registrar pago, Recepción y la futura app.
       ============================================================ */
    const DIAS_POR_VENCER = 7
    let socios = []
    let filtro = 'todos'

    const ETIQUETAS = {
      al_dia: 'AL DÍA',
      por_vencer: 'POR VENCER',
      vencida: 'VENCIDA',
      pendiente: 'PENDIENTE',
      sin_membresia: 'SIN PLAN',
      baja: 'DADO DE BAJA'
    }

    // Estado que se muestra: separa "por vencer" de "al día"
    function estadoVisible(s) {
      if (!s.activo) return 'baja'
      if (s.estado === 'al_dia' && s.dias_restantes <= DIAS_POR_VENCER) return 'por_vencer'
      return s.estado
    }

    async function iniciarPagina() {
      const { data, error } = await db
        .from('v_socios_estado')
        .select('*')
        .order('nombre', { ascending: true })

      if (error) {
        console.error(error)
        document.getElementById('filas').innerHTML = `<tr><td colspan="5" class="vacio-tabla"><strong>No se pudieron cargar los socios</strong>Revisá la conexión y recargá la página.</td></tr>`
        return
      }
      socios = data || []

      // Si viene ?estado=vencida en la URL (por ejemplo desde el inicio), filtra solo
      const estadoUrl = new URLSearchParams(location.search).get('estado')
      if (estadoUrl && ETIQUETAS[estadoUrl]) filtro = estadoUrl

      renderizarContadores()
      renderizarFilas()
    }

    function renderizarContadores() {
      const activos = socios.filter(s => s.activo)
      const cuenta = e => activos.filter(s => estadoVisible(s) === e).length
      const deuda = activos.filter(s => s.estado === 'vencida' || s.estado === 'pendiente')
        .reduce((t, s) => t + Number(s.monto_a_pagar || 0), 0)

      const items = [
        ['todos', 'Socios activos', activos.length, `${socios.length - activos.length} ${socios.length - activos.length === 1 ? 'dado' : 'dados'} de baja`],
        ['al_dia', 'Al día', cuenta('al_dia'), `vencen en +${DIAS_POR_VENCER} días`],
        ['por_vencer', 'Por vencer', cuenta('por_vencer'), `en los próximos ${DIAS_POR_VENCER} días`],
        ['vencida', 'Vencidas', cuenta('vencida'), deuda ? `${pesos(deuda)} por cobrar` : 'nadie debe'],
        ['pendiente', 'Pendientes', cuenta('pendiente'), 'sin pagos registrados'],
        ['sin_membresia', 'Sin plan', cuenta('sin_membresia'), 'sin membresía activa']
      ]

      document.getElementById('contadores').innerHTML = items.map(([clave, nombre, valor, extra]) => `
        <button type="button" class="contador${filtro === clave ? ' activo' : ''}" data-filtro="${clave}" aria-pressed="${filtro === clave}">
          <div class="contador-nombre">${nombre}</div>
          <div class="contador-valor">${valor}</div>
          <div class="contador-extra">${extra}</div>
        </button>`).join('')

      document.querySelectorAll('.contador').forEach(b => b.addEventListener('click', () => {
        filtro = filtro === b.dataset.filtro && b.dataset.filtro !== 'todos' ? 'todos' : b.dataset.filtro
        renderizarContadores()
        renderizarFilas()
      }))
    }

    function renderizarFilas() {
      const q = document.getElementById('buscar').value.trim().toLowerCase()
      const qNum = q.replace(/\D/g, '')
      const verBajas = document.getElementById('verBajas').checked
      const orden = document.getElementById('orden').value

      let lista = socios.filter(s => {
        if (!verBajas && !s.activo) return false
        if (filtro !== 'todos' && estadoVisible(s) !== filtro) return false
        if (!q) return true
        return (s.nombre || '').toLowerCase().includes(q) ||
               (qNum && (String(s.dni || '').includes(qNum) || String(s.telefono || '').replace(/\D/g, '').includes(qNum)))
      })

      const fechaONada = f => f ? new Date(String(f).slice(0, 10)).getTime() : null
      if (orden === 'vencimiento') {
        lista.sort((a, b) => (fechaONada(a.vencimiento) ?? Infinity) - (fechaONada(b.vencimiento) ?? Infinity))
      } else if (orden === 'deuda') {
        lista.sort((a, b) => (b.dias_vencido || 0) - (a.dias_vencido || 0) || (a.nombre || '').localeCompare(b.nombre || ''))
      } else if (orden === 'ultimo_pago') {
        lista.sort((a, b) => (fechaONada(b.ultimo_pago) ?? -Infinity) - (fechaONada(a.ultimo_pago) ?? -Infinity))
      }

      const nombresFiltro = { todos: '', al_dia: ' al día', por_vencer: ' por vencer', vencida: ' con la cuota vencida', pendiente: ' pendientes', sin_membresia: ' sin plan' }
      document.getElementById('conteo').textContent =
        `${lista.length} ${lista.length === 1 ? 'socio' : 'socios'}${nombresFiltro[filtro]}${q ? ` que coinciden con "${q}"` : ''}`

      const tbody = document.getElementById('filas')
      if (!lista.length) {
        tbody.innerHTML = `<tr><td colspan="5" class="vacio-tabla"><strong>No hay socios para mostrar</strong>${q ? 'Probá con otra búsqueda.' : 'Cambiá el filtro para ver otros socios.'}</td></tr>`
        return
      }

      tbody.innerHTML = lista.map(filaSocio).join('')
    }

    function detalleEstado(s) {
      if (!s.activo) return 'Dado de baja'
      switch (s.estado) {
        case 'al_dia':
          return s.dias_restantes === 0 ? 'Vence hoy'
            : `Vence el ${fechaLarga(s.vencimiento)} · ${s.dias_restantes === 1 ? 'falta 1 día' : `faltan ${s.dias_restantes} días`}`
        case 'vencida':
          return `Venció el ${fechaLarga(s.vencimiento)} · hace ${s.dias_vencido === 1 ? '1 día' : `${s.dias_vencido} días`}` +
                 (s.con_recargo ? ' · <span class="recargo">con recargo</span>' : '')
        case 'pendiente':
          return 'Todavía no hay pagos registrados' + (s.con_recargo ? ' · <span class="recargo">con recargo</span>' : '')
        default:
          return 'No tiene una membresía activa'
      }
    }

    function filaSocio(s) {
      const est = estadoVisible(s)
      const nombre = nombreBonito(s.nombre)
      const debe = s.activo && (s.estado === 'vencida' || s.estado === 'pendiente')
      const wa = formatearTelefonoWhatsapp(s.telefono)
      const textoWa = debe
        ? `Hola ${nombre.split(' ')[0]}! Te escribimos de Lion Gym. ${s.estado === 'vencida' ? `Tu cuota venció el ${fechaLarga(s.vencimiento)}` : 'Tenés la cuota pendiente'}; el total es ${pesos(s.monto_a_pagar)}. ¡Te esperamos!`
        : `Hola ${nombre.split(' ')[0]}! Te escribimos de Lion Gym.`
      const dni = encodeURIComponent(s.dni || '')

      return `
        <tr class="${s.activo ? '' : 'de-baja'}">
          <td class="col-socio">
            <div class="socio">
              <span class="avatar-ini" aria-hidden="true">${escapar(iniciales(s.nombre))}</span>
              <div class="socio-texto">
                <div class="socio-nombre">${escapar(nombre)}</div>
                <div class="socio-datos"><span>DNI ${escapar(s.dni || '—')}</span>${s.telefono ? ` · <span>${escapar(s.telefono)}</span>` : ''}</div>
              </div>
            </div>
          </td>
          <td class="col-plan">
            ${s.plan_nombre
              ? `<div class="plan-nombre">${escapar(s.plan_nombre)}</div><div class="plan-precio">${pesos(s.precio)}</div>`
              : '<span class="monto-vacio">—</span>'}
          </td>
          <td class="col-estado">
            <span class="estado-tag ${est}">${ETIQUETAS[est]}</span>
            <div class="estado-detalle">${detalleEstado(s)}</div>
          </td>
          <td class="num col-monto">
            ${debe ? `<span class="monto debe">${pesos(s.monto_a_pagar)}</span>` : '<span class="monto-vacio">—</span>'}
          </td>
          <td class="col-acciones">
            <div class="acciones-fila">
              <a class="accion-fila cobrar${s.plan_nombre ? '' : ' deshabilitada'}" href="registro-pagos.html?dni=${dni}" title="Registrar pago" aria-label="Registrar pago de ${escapar(nombre)}">
                <svg class="icono" viewBox="0 0 24 24"><use href="#i-pago"/></svg>
              </a>
              <a class="accion-fila" href="rutinas.html?dni=${dni}" title="Rutina" aria-label="Rutina de ${escapar(nombre)}">
                <svg class="icono" viewBox="0 0 24 24"><use href="#i-rutinas"/></svg>
              </a>
              <a class="accion-fila" href="editar-socio.html?dni=${dni}" title="Editar datos o plan" aria-label="Editar a ${escapar(nombre)}">
                <svg class="icono" viewBox="0 0 24 24"><use href="#i-usuario-editar"/></svg>
              </a>
              <a class="accion-fila whatsapp${wa ? '' : ' deshabilitada'}" ${wa ? `href="https://wa.me/${wa}?text=${encodeURIComponent(textoWa)}" target="_blank" rel="noopener"` : ''} title="${wa ? (debe ? 'Recordarle el pago por WhatsApp' : 'WhatsApp') : 'Sin teléfono cargado'}" aria-label="WhatsApp">
                <svg class="icono" viewBox="0 0 24 24"><use href="#i-whatsapp"/></svg>
              </a>
            </div>
          </td>
        </tr>`
    }

    document.getElementById('buscar').addEventListener('input', renderizarFilas)
    document.getElementById('orden').addEventListener('change', renderizarFilas)
    document.getElementById('verBajas').addEventListener('change', renderizarFilas)

    verificarAcceso()
  </script>
</body>
</html>
